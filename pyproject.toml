[project]
name = "slife2"
version = "0.3.0"
description = "Terminal-based AI agent"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "juzcn", email = "zhangjun@cueb.edu.cn" },
]
requires-python = ">=3.13"
dependencies = [
    # The MCP server framework and its client, used by every server and both
    # hops.  `Context.report_progress` is what turns a tool call into a
    # progress stream on the server side, and `Client(FastMCP)` is the in-memory
    # transport every server test runs on.  Brings `mcp` transitively; nothing
    # here imports `mcp` directly, so it is not listed.
    # The floor is 4.1.1 because `slife2.clients.gateway.make_client` pins
    # `Client(mode="legacy")`: that argument arrived with 4.1, and a 4.0.x
    # client would reject it and fail every connect.
    "fastmcp>=4.1.1",
    # The ASGI layer under it, imported *directly* by one plugin and nowhere
    # else: the file tunnel serves `GET /share/{token}` beside its MCP
    # endpoint, and a custom route is written as a Starlette handler
    # (`Request` in, `Response` out).  It arrives with FastMCP either way, and
    # is declared by the same rule as `httpx2` below — a module this project
    # imports is a dependency this project states.
    "starlette>=1.7.0",
    # The TUI.  Brings `rich` transitively; we do not import it.
    "textual>=8.2.8",
    # The WeChat bridge, which is the one thing here that talks to somebody who
    # is not a model: `slife2.plugins.wechat.ilink` makes plain HTTP requests, and this is the
    # client FastMCP already brings — as a distribution named `httpx2`, imported
    # under that name.  Declared rather than relied on transitively, by the same
    # rule as the provider SDKs below: a module this project imports is a
    # dependency this project states.
    "httpx2>=2.13.1",
    # The login QR, drawn with half-block characters (`█▀▄`) so it can be
    # scanned off the terminal a person is already looking at.
    # `slife2-wechat` does not need it to *run* — without it the login hands
    # over the URL instead of a code — which is why the import is inside the one
    # function that draws.
    "qrcode>=8.0",
    # slife2.yaml.  Comment-preserving, so a rewrite does not eat the file's
    # explanation of itself.
    "ruamel.yaml>=0.19.0",
    # Resolves `${VAR}` and `keyring:` references against the OS keyring, which
    # is where provider API keys live.  Used rather than reimplemented.
    "credstore>=0.10.5",
    # **The OS trust store, for every TLS client this package starts.**  The
    # provider SDKs, the MCP client, media and the tunnels all verify against
    # certifi by default, and certifi is a bundle that can lag — or be narrower
    # than — the CA set the machine actually uses.  A task container's curl and
    # apt trusted the provider's chain while the venv's certifi did not, which
    # failed an embeddings call that was reachable.  `slife2/__init__.py`
    # injects this at package import; declared here because the package imports
    # it directly.
    "truststore>=0.10.5",
    # Provider SDKs.  Imported *only* by the LLM server processes — one per wire
    # protocol, plus the embeddings server, so `openai` is imported by three of
    # them and `anthropic` by one: the TUI, the agent loop and every shared
    # module stay free of both, which is the whole point of putting the backends
    # behind MCP.
    "openai>=2.46.0",
    "anthropic>=1.2.0",
    # The fourth tunnel provider's own SDK, and the only dependency here that is
    # *not* a model backend.  It embeds
    # the ngrok agent as a native extension, so the `ngrok` provider needs no
    # external binary where the other two need `ssh` or `cloudflared`.  The
    # import is inside the one function that starts that tunnel
    # (`slife2.plugins.file_tunnel.providers._import_ngrok`), by the same rule as
    # `qrcode` below: a build without it runs every other provider and reports
    # this one as unavailable when it is selected.
    "ngrok>=1.6.0",
    "jinja2>=3.1.0",
    # Cron, for the scheduled tasks (`slife2.plugins.schedule.expressions`, SDD §9.4).
    # The five fields are trivial and the corners are not: `day_or`, the DST rule,
    # and `strict` cross-field validation, which is what rejects `0 9 31 2 *`
    # before an enabled task that can never fire is written down.  Only
    # `get_next`, `get_prev` and `is_valid` are used, and only from one module:
    # `slife2.plugins.schedule.expressions` owns the timezone policy and the error
    # contract, so nothing else in this project imports it.
    "croniter>=6.2.4",
    # The vector index.  Not an SDK and not a server: a SQLite extension, loaded
    # per connection by `slife2.libs.store.index`, which is why it is a dependency of the
    # package rather than something a backend process holds.  A floor rather
    # than a pin like everything else here, but note that it is still alpha —
    # the DDL it accepts is probed at open time rather than assumed (see
    # `slife2.libs.store.index.vector_ddl`), and `distance_metric` and `float[N]` are the
    # parts of that alpha this project depends on.  Wheels are `py3-none-*` for
    # every platform CI builds on, so there is no interpreter-specific tag to
    # match.
    "sqlite-vec>=0.1.9",
    # **Never imported, and required on one platform.**  `zoneinfo` reads the
    # system's IANA database where there is one — macOS and Linux have it — and
    # has nothing to read on Windows, where this project is developed.  So
    # `ZoneInfo("Asia/Shanghai")` raises `ZoneInfoNotFoundError` on a Windows
    # machine without this package, which turns every named timezone in
    # `slife2.plugins.schedule.expressions` into a failure nobody can reproduce
    # from Linux.  The reason is invisible from an import that does not exist:
    # `zoneinfo` loads it by name, from C.
    "tzdata>=2026.5",
    # The A2A mesh (`slife2.plugins.a2a`, SDD §9.2), and **the wire is not ours**.
    # The published A2A-over-MQTT profile *is* the SDK: the topic tree, the
    # retained agent card with presence carried by an MQTT user property, the
    # JSON-RPC 2.0 envelopes whose `ResponseTopic`/`CorrelationData` properties
    # carry the reply routing, the task lifecycle with its per-task dedup, and
    # the requester's retry ladder.  What this project writes is the driver
    # around it: interop with the rest of the ecosystem follows from the wire
    # being somebody else's, and a self-built binding would be a second protocol
    # wearing the name.  Imported only by `slife2/plugins/a2a/mesh.py`.
    "a2a-over-mqtt>=0.1.0",
    # The MQTT client under that SDK, imported *directly* by the same module, for
    # the one thing the SDK does not offer: its own `Requester` is
    # connection-per-call, which is exactly wrong here — a send returns a task
    # id and the result is pushed back later, possibly to a different
    # correlation than the one it was sent under.  So the outbound half is a
    # persistent `aiomqtt` client of our own, and the pre-join name probe is a
    # second, short-lived one.  Declared by the same rule as `httpx2` above: a
    # module this project imports is a dependency this project states.  It
    # brings `paho-mqtt`, which is declared separately below for the one type
    # `mesh.py` takes from it directly.
    "aiomqtt>=2.5.0",
    # `aiomqtt`'s `subscribe(options=…)` takes paho's own
    # `SubscribeOptions` and does not re-export it — and that is the only way
    # to ask for MQTT v5's No Local, which is what keeps a member's broadcast
    # from being delivered back to the member that published it
    # (`slife2/plugins/a2a/mesh.py`).  So the type is imported directly from
    # the library that defines it.
    "paho-mqtt>=2.1.0",
    # The tokenizer `slife2.libs.turn.tokens` sizes a conversation with, and **the one
    # dependency here that is not needed to run**.  It is imported inside the
    # one function that resolves it, so a process that never estimates pays
    # nothing; and the vocabulary it needs is *not* in the wheel — `tiktoken`
    # fetches a few megabytes the first time anybody asks for an encoding, which
    # is why a failure to get one is handled rather than raised: the script
    # measure answers instead, and a machine with no network runs everything
    # (`slife2.libs.turn.tokens` states the argument, including why `o200k_base` is the
    # right base for endpoints that do not use it).  Declared as a plain
    # dependency rather than an extra, because the fallback is a degradation
    # rather than an alternative — an installation that skipped it would size
    # every conversation by hand on every machine, not just the offline ones.
    "tiktoken>=0.14.0",
    # The docstring parser FastMCP already uses, imported directly by
    # `slife2.libs.plugin.protocol` for the one thing FastMCP discards: a tool's
    # `Returns:` section, which the middleware puts on `_meta` for the catalogue.
    # The distribution is `griffelib`; the module it installs is `griffe`.  It
    # arrives with FastMCP's own `server` extra today, and is declared by the same
    # rule as `httpx2` and `paho-mqtt` above: a module this project imports is a
    # dependency this project states.  The import is inside the one function that
    # parses, so a process that never lists a tool pays nothing.
    "griffelib>=2.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Terminals",
]

# One console script per plugin, rather than one script with subcommands, so
# a process manager can start any plugin without passing it an argument.
# Each of these is a process that speaks MCP; `slife2` is the only client.
[project.scripts]
slife2 = "slife2:main"
slife2-agent = "slife2.plugins.agent.server:main"
slife2-agent-task = "slife2.plugins.agent_task.server:main"
slife2-schedule = "slife2.plugins.schedule.server:main"
slife2-a2a = "slife2.plugins.a2a.server:main"
slife2-context = "slife2.plugins.context.server:main"
slife2-skills = "slife2.plugins.skills.server:main"
slife2-cli = "slife2.plugins.cli.server:main"
slife2-mcp-tools = "slife2.plugins.mcp_tools.server:main"
slife2-restapi-tools = "slife2.plugins.restapi.server:main"
slife2-toolhub = "slife2.plugins.toolhub.server:main"
slife2-wechat = "slife2.plugins.wechat.server:main"
slife2-cabinet = "slife2.plugins.cabinet.server:main"
slife2-media = "slife2.plugins.media.server:main"
slife2-file-tunnel = "slife2.plugins.file_tunnel.server:main"
slife2-tui = "slife2.plugins.tui.server:main"
slife2-llm-openai = "slife2.plugins.llm.openai_server:main"
slife2-llm-anthropic = "slife2.plugins.llm.anthropic_server:main"
slife2-llm-openai-responses = "slife2.plugins.llm.openai_responses_server:main"
slife2-llm-embeddings = "slife2.plugins.llm.embeddings_server:main"

[tool.hatch.build.targets.wheel]
packages = ["slife2"]

[tool.hatch.build.targets.sdist]
include = [
    "/slife2",
    "/scripts",
    "/tests",
    "/README.md",
    "/SDD.md",
    "/LICENSE",
    "/pyproject.toml",
    # The working config, checked in deliberately: it holds no secrets, because
    # every key in it is a ${VAR} reference resolved at runtime.
    "/slife2.yaml",
]

[build-system]
# Unpinned deliberately. slife2 publishes with `uv publish`
# (`.github/workflows/publish.yml`), which validates the wheel rather than the
# metadata version, so there is no twine floor to keep in step and nothing to
# cap.
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    # The type checker `[tool.pyright]` below configures.  It was configured and
    # never installed, which is how a settings block becomes a comment: the
    # rules were there, nothing ran them, and the first run after wiring it up
    # found two live bugs — an attribute read off a union member in the middle
    # of a stream.  CI runs it beside ruff.
    "pyright>=1.1.414",
]

[tool.uv.workspace]
# The workspace root is *also* a workspace member and must not list itself, so
# `members` names only the additional packages.  slife2 is a workspace of one:
# a sibling package joins by adding its directory and one entry here.
members = []

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "module"
# **The suite is the thing this project evolves against, so the default
# invocation is the fast one.**  Two lanes, one command apart:
#
#   `uv run pytest`        unit + integration, every module, across workers
#   `uv run pytest -m e2e` the whole stack as processes (tests/e2e/, ~65s)
#
# `-n auto` is xdist: the suite is ~5 minutes in one process and ~40 seconds
# across the cores, and a gate somebody waits five minutes for is a gate that
# gets run less often than it should.  `-m "not e2e"` keeps the lane that starts
# seventeen daemons out of that default — a later `-m` on the command line
# replaces this one rather than adding to it, which is what makes the second
# command above work.
#
# **A hang is a failure here, and it has to be a loud one.**  The way a test of
# this system breaks is often not a wrong value or an exception but a wait that
# never ends — a lock held across a turn that is itself waiting, a background
# task nobody cancels — and a wedged lane costs the whole CI job rather than the
# one test, reporting nothing: measured once at 100% of the dots and no summary,
# with the culprit only findable by bisecting by hand.  `faulthandler` dumps
# every thread's stack after this many seconds and exits, so the same defect is
# a named traceback in three minutes.  The bound is generous on purpose: the
# slowest test in the fast lane is ~7 s and the e2e lane's stack takes ~50 s to
# come up, so nothing legitimate comes near it.
addopts = "-q --tb=short --strict-markers --strict-config --no-header --color=yes --durations=10 -n auto -m 'not e2e'"
faulthandler_timeout = 180
faulthandler_exit_on_timeout = true
filterwarnings = [
    # CPython 3.13+: unittest.mock._AsyncMockMixin creates unawaited
    # coroutine wrappers at class-definition time.  GC may collect them
    # during any module import — not just unittest.mock.
    # https://github.com/python/cpython/issues/126242
    "ignore:coroutine .* was never awaited:RuntimeWarning",
]
markers = [
    "asyncio: mark a test as an async test",
    "slow: mark a test as slow (excluded from quick test runs with -m 'not slow')",
    "unit: fast, isolated unit test (no I/O, no subprocess)",
    "integration: test requiring I/O, network, or subprocess",
    "e2e: the whole stack as processes, against a stub provider; excluded from the default run, asked for with `-m e2e`",
]

[tool.ruff]
line-length = 88
target-version = "py313"
# skills/ is *content*, not code this project ships: each skill is a directory
# somebody wrote or downloaded, scripts and all, and ruff has no business
# reformatting a playbook whose upstream would be updated from somewhere else.
# It is the same rule the formatter follows for generated code — the file is
# not ours to have an opinion about.
#
# jobs/ is the home's code the model wrote for itself (SDD §2.6): user data
# like agents/, not project source like slife2/.  The author's own style is
# theirs; the runtime gate is load/schema, not lint.  `ruff check .` in CI is
# the only project gate that scans the repository root, so this is what keeps a
# job created in a development checkout from failing the build.
extend-exclude = ["skills", "jobs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "BLE"]
# BLE001 is the one rule here that is a *convention* rather than a style: this
# codebase catches broadly in the places where a peer's failure is data, and
# every one of those says why on the line — which is what the rule enforces.
# The annotations were already written before the rule was switched on, so
# several of them named a check that never ran.
# The formatter owns line width: it wraps what it can and leaves long strings
# and URLs alone, so E501 would only ever fire on lines it cannot fix.
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["slife2"]
# `jobs/**` is explicit although `include` already stops at slife2: the editor's
# language server analyses a file the moment it is opened, and the jobs folder is
# user data whose type errors are the author's to fix, not the project's build.
exclude = ["**/__pycache__/**", "**/.venv/**", ".venv/**", "tests/**", "jobs/**", "**/node_modules", "**/.*"]
reportMissingImports = true
reportMissingTypeStubs = false
reportOptionalSubscript = true
reportInvalidTypeForm = true
reportUnusedImport = "error"
reportUnusedVariable = "error"

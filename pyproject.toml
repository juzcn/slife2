[project]
name = "slife2"
version = "0.4.0"
description = "Terminal-based AI agent"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "juzcn", email = "zhangjun@cueb.edu.cn" },
]
requires-python = ">=3.13"
# Every module this project imports is declared here, even one a dependency
# already brings transitively.
dependencies = [
    # 4.1.1 is the floor: make_client pins `Client(mode="legacy")`, which 4.0
    # does not accept.
    "fastmcp>=4.1.1",
    "starlette>=1.7.0",
    "textual>=8.2.8",
    "httpx2>=2.13.1",
    "qrcode>=8.0",
    "ruamel.yaml>=0.19.0",
    "credstore>=0.10.5",
    # Injects the OS trust store over certifi at package import.
    "truststore>=0.10.5",
    "openai>=2.46.0",
    "anthropic>=1.2.0",
    "ngrok>=1.6.0",
    "jinja2>=3.1.0",
    "croniter>=6.2.4",
    # Alpha: the DDL it accepts is probed at open time, not assumed.
    "sqlite-vec>=0.1.9",
    # Never imported: it gives `zoneinfo` a database on Windows.
    "tzdata>=2026.5",
    "a2a-over-mqtt>=0.1.0",
    "aiomqtt>=2.5.0",
    "paho-mqtt>=2.1.0",
    # The vocabulary is fetched on first use; a failed fetch degrades to the
    # script measure.
    "tiktoken>=0.14.0",
    "griffelib>=2.0.0",
    # The job authoring loop's checks; nothing imports them.
    "ruff>=0.16.10",
    "pyright>=1.1.414",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Terminals",
]

# One script per plugin process; each speaks MCP, and only `slife2` is a client.
[project.scripts]
slife2 = "slife2:main"
slife2-agent = "slife2.plugins.agent.server:main"
slife2-agent-task = "slife2.plugins.agent_task.server:main"
slife2-schedule = "slife2.plugins.schedule.server:main"
slife2-a2a = "slife2.plugins.a2a.server:main"
slife2-context = "slife2.plugins.context.server:main"
slife2-skills = "slife2.plugins.skills.server:main"
slife2-cli = "slife2.plugins.cli.server:main"
slife2-jobs = "slife2.plugins.jobs.server:main"
slife2-mcp-tools = "slife2.plugins.mcp_tools.server:main"
slife2-restapi-tools = "slife2.plugins.restapi.server:main"
slife2-toolhub = "slife2.plugins.toolhub.server:main"
slife2-wechat = "slife2.plugins.wechat.server:main"
slife2-cabinet = "slife2.plugins.cabinet.server:main"
slife2-media = "slife2.plugins.media.server:main"
slife2-file-tunnel = "slife2.plugins.file_tunnel.server:main"
slife2-tui = "slife2.plugins.tui.server:main"
slife2-llm-openai = "slife2.plugins.llm.openai_server:main"
slife2-llm-anthropic = "slife2.plugins.llm.anthropic_server:main"
slife2-llm-openai-responses = "slife2.plugins.llm.openai_responses_server:main"
slife2-llm-embeddings = "slife2.plugins.llm.embeddings_server:main"

[tool.hatch.build.targets.wheel]
packages = ["slife2"]

# The package and what an installed home is seeded from — a distribution
# without skills/, jobs/ or the two home documents could not complete a setup.
[tool.hatch.build.targets.sdist]
include = [
    "/slife2",
    "/scripts",
    "/skills",
    "/jobs",
    "/tests",
    "/README.md",
    "/SDD.md",
    "/LICENSE",
    "/pyproject.toml",
    "/slife2.yaml",
    "/AGENTS.md",
]

[build-system]
# Unpinned; publishing goes through `uv publish`, which does not need twine.
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv.workspace]
# The root is a member already; this lists only additional packages.
members = []

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "module"
# The fast lane by default; `-m e2e` replaces the marker filter, which is what
# asks for the process-level lane.  A hang exits with every thread's stack
# after the bound instead of wedging the job with no summary at all.
addopts = "-q --tb=short --strict-markers --strict-config --no-header --color=yes --durations=10 -n auto -m 'not e2e'"
faulthandler_timeout = 180
faulthandler_exit_on_timeout = true
filterwarnings = [
    # CPython 3.13 async-mock wrappers; python/cpython#126242
    "ignore:coroutine .* was never awaited:RuntimeWarning",
]
markers = [
    "asyncio: mark a test as an async test",
    "slow: mark a test as slow (excluded from quick test runs with -m 'not slow')",
    "unit: fast, isolated unit test (no I/O, no subprocess)",
    "integration: test requiring I/O, network, or subprocess",
    "e2e: the whole stack as processes, against a stub provider; excluded from the default run, asked for with `-m e2e`",
]

[tool.ruff]
line-length = 88
target-version = "py313"
# Content, not project source: skills and jobs are somebody else's playbooks and
# the home's own code, and tools/ is what the model composes for one job.
extend-exclude = ["skills", "jobs", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "BLE"]
# BLE001: every blanket catch here says why on the line.  Line width is the
# formatter's to own.
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["slife2"]
# tests/ use deliberate doubles.  jobs/ is not project source, but the authoring
# skill runs `pyright <job file>` explicitly, so the path must analyse; CI runs
# this config with no file argument and stays on `slife2`.
exclude = ["**/__pycache__/**", "**/.venv/**", ".venv/**", "tests/**", "**/node_modules", "**/.*"]
reportMissingImports = true
reportMissingTypeStubs = false
reportOptionalSubscript = true
reportInvalidTypeForm = true
reportUnusedImport = "error"
reportUnusedVariable = "error"

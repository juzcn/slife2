[project]
name = "slife2"
version = "0.1.0"
description = "Terminal-based AI agent — slife v2, a clean-slate rebuild"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "juzcn", email = "zhangjun@cueb.edu.cn" },
]
requires-python = ">=3.13"
dependencies = [
    # The MCP server framework and its client, used by every server and both
    # hops.  `Context.report_progress` is what turns a tool call into a
    # progress stream on the server side, and `Client(FastMCP)` is the in-memory
    # transport every server test runs on.  Brings `mcp` transitively; nothing
    # here imports `mcp` directly, so it is not listed.
    "fastmcp>=4.0.1",
    # The ASGI layer under it, imported *directly* by one plugin and nowhere
    # else: the file tunnel serves `GET /share/{token}` beside its MCP
    # endpoint, and a custom route is written as a Starlette handler
    # (`Request` in, `Response` out).  It arrives with FastMCP either way, and
    # is declared by the same rule as `httpx2` below — a module this project
    # imports is a dependency this project states.
    "starlette>=1.7.0",
    # The TUI.  Brings `rich` transitively; we do not import it.
    "textual>=8.2.8",
    # The WeChat bridge, which is the one thing here that talks to somebody who
    # is not a model: `slife2.ilink` makes plain HTTP requests, and this is the
    # client FastMCP already brings — as a distribution named `httpx2`, imported
    # under that name.  Declared rather than relied on transitively, by the same
    # rule as the provider SDKs below: a module this project imports is a
    # dependency this project states.
    "httpx2>=2.13.1",
    # The login QR, drawn with half-block characters (`█▀▄`) so it can be
    # scanned off the terminal a person is already looking at.  v1's dependency
    # and v1's reason.  `slife2-wechat` does not need it to *run* — without it
    # the login hands over the URL instead of a code — which is why the import
    # is inside the one function that draws.
    "qrcode>=8.0",
    # slife2.yaml.  Comment-preserving, so a rewrite does not eat the file's
    # explanation of itself — the same reason v1 uses it.
    "ruamel.yaml>=0.19.0",
    # Resolves `${VAR}` and `keyring:` references against the OS keyring, which
    # is where provider API keys live.  Published out of the slife repo, so this
    # is v1's credstore rather than a reimplementation.
    "credstore>=0.10.5",
    # Provider SDKs.  Imported *only* by the LLM server processes — one per wire
    # protocol, plus the embeddings server, so `openai` is imported by three of
    # them and `anthropic` by one: the TUI, the agent loop and every shared
    # module stay free of both, which is the whole point of putting the backends
    # behind MCP.
    "openai>=2.46.0",
    "anthropic>=1.2.0",
    # The fourth tunnel provider's own SDK — v1's dependency for the same
    # plugin, and the only one here that is *not* a model backend.  It embeds
    # the ngrok agent as a native extension, so the `ngrok` provider needs no
    # external binary where the other two need `ssh` or `cloudflared`.  The
    # import is inside the one function that starts that tunnel
    # (`slife2.file_tunnel.providers._import_ngrok`), by the same rule as
    # `qrcode` below: a build without it runs every other provider and reports
    # this one as unavailable when it is selected.
    "ngrok>=1.6.0",
    "jinja2>=3.1.0",
    # Cron, for the scheduled tasks (`slife2.schedule`, DESIGN.md §1.7).  **v1's
    # dependency, for v1's feature, and after v1's own argument with itself**: the
    # design notes for that feature say "no apscheduler, no croniter, hand-write
    # the parser" and the implementation used croniter anyway.  What decided it
    # there is what decides it here — the five fields are trivial and the corners
    # are not: `day_or`, the DST rule, and `strict` cross-field validation, which
    # is what rejects `0 9 31 2 *` before an enabled task that can never fire is
    # written down.  Only `get_next`, `get_prev` and `is_valid` are used, and only
    # from one module: `slife2.schedule` owns the timezone policy and the error
    # contract, so nothing else in this project imports it.
    "croniter>=6.2.4",
    # The vector index.  Not an SDK and not a server: a SQLite extension, loaded
    # per connection by `slife2.db`, which is why it is a dependency of the
    # package rather than something a backend process holds.  A floor rather
    # than a pin like everything else here, but note that it is still alpha —
    # the DDL it accepts is probed at open time rather than assumed (see
    # `slife2.db._vector_ddl`), and `distance_metric` and `float[N]` are the parts
    # of that alpha this project depends on.  Wheels are `py3-none-*` for every
    # platform CI builds on, so there is no interpreter-specific tag to match.
    "sqlite-vec>=0.1.9",
    # **Never imported, and required on one platform.**  `zoneinfo` reads the
    # system's IANA database where there is one — macOS and Linux have it — and
    # has nothing to read on Windows, where this project is developed.  So
    # `ZoneInfo("Asia/Shanghai")` raises `ZoneInfoNotFoundError` on a Windows
    # machine without this package, which turns every named timezone in
    # `slife2.schedule` into a failure nobody can reproduce from Linux.  v1's
    # dependency with v1's comment, kept because the reason is invisible from an
    # import that does not exist: `zoneinfo` loads it by name, from C.
    "tzdata>=2026.5",
    # The A2A mesh (`slife2.a2a`, DESIGN.md §1.8), and **the wire is not ours**.
    # The published A2A-over-MQTT profile *is* the SDK: the topic tree, the
    # retained agent card with presence carried by an MQTT user property, the
    # JSON-RPC 2.0 envelopes whose `ResponseTopic`/`CorrelationData` properties
    # carry the reply routing, the task lifecycle with its per-task dedup, and
    # the requester's retry ladder.  What this project writes is the driver
    # around it — v1's arrangement and v1's reason: interop with the rest of the
    # ecosystem follows from the wire being somebody else's, and a self-built
    # binding would be a second protocol wearing the name.  Imported only by
    # `slife2/a2a/mesh.py`.
    "a2a-over-mqtt>=0.1.0",
    # The MQTT client under that SDK, imported *directly* by the same module, for
    # the one thing the SDK does not offer: its own `Requester` is
    # connection-per-call, which is exactly wrong here — a send returns a task
    # id and the result is pushed back later, possibly to a different
    # correlation than the one it was sent under.  So the outbound half is a
    # persistent `aiomqtt` client of our own, and the pre-join name probe is a
    # second, short-lived one.  Declared by the same rule as `httpx2` above: a
    # module this project imports is a dependency this project states.  It
    # brings `paho-mqtt`, which nothing here imports.
    "aiomqtt>=2.5.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Terminals",
]

# One console script per plugin, rather than one script with subcommands, so
# a process manager can start any plugin without passing it an argument.
# Each of these is a process that speaks MCP; `slife2` is the only client.
[project.scripts]
slife2 = "slife2:main"
slife2-agent = "slife2.server.server:main"
slife2-agent-task = "slife2.agent_task_server:main"
slife2-schedule = "slife2.schedule_server:main"
slife2-a2a = "slife2.a2a.server:main"
slife2-context = "slife2.context_server:main"
slife2-skills = "slife2.skills_server:main"
slife2-cli = "slife2.cli_server:main"
slife2-mcp-tools = "slife2.mcp_tools:main"
slife2-restapi-tools = "slife2.restapi_tools:main"
slife2-toolhub = "slife2.toolhub:main"
slife2-wechat = "slife2.wechat:main"
slife2-cabinet = "slife2.cabinet:main"
slife2-media = "slife2.media.server:main"
slife2-file-tunnel = "slife2.file_tunnel.server:main"
slife2-tui = "slife2.tui.control:main"
slife2-llm-openai = "slife2.llm.openai_server:main"
slife2-llm-anthropic = "slife2.llm.anthropic_server:main"
slife2-llm-openai-responses = "slife2.llm.openai_responses_server:main"
slife2-llm-embeddings = "slife2.llm.embeddings_server:main"

[tool.hatch.build.targets.wheel]
packages = ["slife2"]

[tool.hatch.build.targets.sdist]
include = [
    "/slife2",
    "/tests",
    "/README.md",
    "/DESIGN.md",
    "/LICENSE",
    "/pyproject.toml",
    # The working config, checked in deliberately: it holds no secrets, because
    # every key in it is a ${VAR} reference resolved at runtime.
    "/slife2.yaml",
]

[build-system]
# Unpinned, unlike slife — v1 caps hatchling below 1.27 only so `twine check`
# accepts the Metadata-Version it emits, which is a constraint of its *publish*
# pipeline.  slife2 has none yet; add the cap alongside the publish workflow.
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    # The type checker `[tool.pyright]` below configures.  It was configured and
    # never installed, which is how a settings block becomes a comment: the
    # rules were there, nothing ran them, and the first run after wiring it up
    # found two live bugs — an attribute read off a union member in the middle
    # of a stream.  CI runs it beside ruff.
    "pyright>=1.1.414",
]

[tool.uv.workspace]
# The workspace root is *also* a workspace member and must not list itself, so
# `members` names only the additional packages.  slife2 is a workspace of one:
# a sibling package joins by adding its directory and one entry here.
members = []

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "module"
addopts = "-q --tb=short --strict-markers --strict-config --no-header --color=yes --durations=10"
filterwarnings = [
    # CPython 3.13+: unittest.mock._AsyncMockMixin creates unawaited
    # coroutine wrappers at class-definition time.  GC may collect them
    # during any module import — not just unittest.mock.
    # https://github.com/python/cpython/issues/126242
    "ignore:coroutine .* was never awaited:RuntimeWarning",
]
markers = [
    "asyncio: mark a test as an async test",
    "slow: mark a test as slow (excluded from quick test runs with -m 'not slow')",
    "unit: fast, isolated unit test (no I/O, no subprocess)",
    "integration: test requiring I/O, network, or subprocess",
    "e2e: end-to-end test requiring a full running system",
]

[tool.ruff]
line-length = 88
target-version = "py313"
# skills/ is *content*, not code this project ships: each skill is a directory
# somebody wrote or downloaded, scripts and all, and ruff has no business
# reformatting a playbook whose upstream would be updated from somewhere else.
# It is the same rule the formatter follows for generated code — the file is
# not ours to have an opinion about.
extend-exclude = ["skills"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "BLE"]
# BLE001 is the one rule here that is a *convention* rather than a style: this
# codebase catches broadly in the places where a peer's failure is data, and
# every one of those says why on the line — which is what the rule enforces.
# The annotations were already written before the rule was switched on, so
# several of them named a check that never ran.
# The formatter owns line width: it wraps what it can and leaves long strings
# and URLs alone, so E501 would only ever fire on lines it cannot fix.
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["slife2"]
exclude = ["**/__pycache__/**", "**/.venv/**", ".venv/**", "tests/**", "**/node_modules", "**/.*"]
reportMissingImports = true
reportMissingTypeStubs = false
reportOptionalSubscript = true
reportInvalidTypeForm = true
reportUnusedImport = "error"
reportUnusedVariable = "error"

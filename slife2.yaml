# slife2.yaml — the machine's configuration.
#
# One file, read by the launcher and every server. A missing file means the
# built-in defaults; an unreadable one stops the start and names the mistake.
#
# The file holds no secrets. Credentials are references resolved when used:
#
#     shell env  ->  credstore  ->  literal default
#
# `${VAR}` and `${VAR:-default}` read the shell and then the OS keyring.
# `keyring:<service>/<key>` reads the keyring directly. An unresolved reference
# is left verbatim and fails at the API call, where the error can name it.

# Shift every port by this much in WSL2 mirrored mode (Windows and WSL share
# loopback); ignored elsewhere. 0 disables it.
wsl_port_offset: 1000

servers:
  # One process per wire protocol; the address is 127.0.0.1:<port>/mcp.
  openai-completions: {port: 8001}
  anthropic-messages: {port: 8002}
  openai-responses: {port: 8003}
  embeddings: {port: 8004}
  # The agent loop, the context store and the tool set.
  agent: {port: 8000}
  context: {port: 8010}
  toolhub: {port: 8020}
  # The two families that hold other people's servers.
  mcp-tools: {port: 8033}
  restapi-tools: {port: 8034}
  # The two families built from documents.
  cli-server: {port: 8032}
  skills-server: {port: 8031}
  # Capabilities.
  wechat: {port: 8030}
  cabinet: {port: 8035}
  tui: {port: 8005}
  schedule: {port: 8039}
  peer_agent: {port: 8040}
  subagent: {port: 8041}
  media: {port: 8036}
  file-tunnel: {port: 8038}
  agent-task: {port: 8037}

providers:
  # `api` selects the wire protocol. Models are referenced as `provider/model`.
  deepseek:
    api: openai-completions
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}
    models:
      - model: deepseek-flash
        name: DeepSeek Flash
        reasoning: true
        input:
          - text
          - image
        context_window: 1000000
        max_tokens: 384000
        temperature: 0.7
        top_p: 1.0

  scnet:
    api: openai-completions
    base_url: https://api.scnet.cn/api/llm/v1
    api_key: ${SCNET_TOKEN_PLAN}
    models:
      - model: DeepSeek-V4
        name: DeepSeek V4 Pro
        reasoning: true
        input:
          - text
        context_window: 1000000
        max_tokens: 384000
        temperature: 0.7
        top_p: 1.0
      - model: Kimi-K3
        name: Kimi K3
        reasoning: true
        input:
          - text
          - image
        context_window: 1048576
        max_tokens: 131072
        # This gateway rejects the standard thinking shape while reasoning
        # natively, so send no thinking field.
        compat:
          thinking: omit

  bailian:
    api: anthropic-messages
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/apps/anthropic
    api_key: ${QWEN_TOKEN_PLAN_PERSONAL}
    models:
      - model: qwen3.8-max
        name: Qwen3.8 Max
        reasoning: true
        input:
          - text
          - image
        context_window: 983616
        max_tokens: 131072

  # The Responses protocol is a separate provider entry with
  # `api: openai-responses`, not a flag on chat completions.

# The model a new conversation starts on, as `provider/model`.
default: deepseek/deepseek-flash

agent:
  # Model calls per turn. 0 or absent means no cap: the turn ends when the
  # model stops asking for tools.
  max_iterations: 0
  # A Jinja2 template, looked up relative to this file. `{{ agent_name }}` and
  # `{{ headless }}` are available. Omit to use the shipped template.
  # system_prompt: prompts/jack.j2

agent-task:
  # Background tasks running at once per agent. A task may start a task; this
  # bounds concurrency, not total work over time.
  max_running: 4

subagent:
  # Subagents per agent. The tree stops at one level: a subagent cannot create
  # or remove a subagent. A non-fork subagent owns its turns.db, cabinet and
  # media under its own directory; a fork stores no turns and only reads the
  # maker's turn log, shares the maker's cabinet and media, and is removed when
  # the agent server next starts. A subagent has no external identity: no WeChat
  # login and no peer_agent presence. Schedule stays with the agent.
  max_running: 32
  # The local network. The unit is always the agent's name, so writing `unit:`
  # is refused; `org` may be set to group meshes. This is also the broker
  # `peer_agent:` falls back to when it names none.
  provider: mosquitto
  broker:
    host: localhost
    port: 1883

embeddings:
  # OpenAI-compatible embedding endpoints. The vector width is discovered at
  # runtime; changing the model rebuilds the index on the next start.
  providers:
    local:
      base_url: http://127.0.0.1:17347/v1
      model: bge-m3
      api_key: local
    siliconflow:
      base_url: https://api.siliconflow.cn/v1
      model: BAAI/bge-m3
      api_key: ${SILICONFLOW_API_KEY}
  # A provider id, not `provider/model`. An unknown value falls back to the
  # first provider.
  active_model: siliconflow

context:
  # `ceiling` and `floor` are fractions of the model's context window.
  ceiling: 0.8
  floor: 0.2
  recall_limit: 40
  # Gates measured similarity only; a keyword hit is exempt.
  min_similarity: 0.45
  # Seconds for the discriminator call; past it the turn uses its current
  # context.
  timeout: 20.0

tool_load:
  # Above this many loaded tools, the least recently called are unloaded at a
  # turn boundary. Our own tools and `autoload` sources are never evicted.
  threshold: 100

tool_result:
  # A result over this is stored whole as a dump; the conversation carries a
  # selection of its lines. `dump_read` obeys the same budget. Minimum 128.
  tokens: 8000

mcp:
  # Other people's MCP servers. `command` starts a process; `url` connects to
  # one already running. `autoload: true` starts its tools loaded;
  # `enabled: false` keeps an entry configured but never connects it. Each tool
  # arrives as `{name}__{tool}`.
  serper:
    command: npx
    args:
      - -y
      - serper-search-scrape-mcp-server
    env:
      SERPER_API_KEY: ${SERPER_API_KEY}
    description: Google web search via Serper — search the web and scrape result pages.
  fetch:
    command: uvx
    args:
      - --with
      - mcp>=1.0,<1.29
      - mcp-server-fetch
    description: Fetch and convert web pages to markdown. Pins mcp<1.29 for McpError compatibility.
  tavily-mcp:
    command: npx
    args:
      - -y
      - tavily-mcp@latest
    env:
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    description: Tavily AI-optimized web search — designed for LLM agents, returns clean structured results.
  duckduckgo-search:
    command: uvx
    args:
      - --with
      - duckduckgo-mcp-server[browser]
      - duckduckgo-mcp-server
      - --fetch-backend
      - auto
      - --search-backend
      - auto
    description: DuckDuckGo search MCP server — web search and content extraction via DuckDuckGo.
  amap-maps:
    command: npx
    args:
      - -y
      - '@amap/amap-maps-mcp-server'
    env:
      AMAP_MAPS_API_KEY: ${AMAP_MAPS_API_KEY}
    description: 高德地图官方 MCP Server，提供地理编码、逆地理编码、IP定位、天气查询、骑行/步行/驾车/公交路径规划、距离测量、关键词/周边/详情POI搜索、专属地图、输入提示、搜索提示、矩形区域交通态势、路径信息、距离测量等多种地图和位置服务。免费，需要申请 Web服务 API Key。
  playwright:
    command: npx
    args:
      - -y
      - '@playwright/mcp@latest'
      - --headless
    # Starts confined to the data directory; there is no --allow-path
    # equivalent.
    description: Playwright MCP server (official Microsoft) — headless browser automation via accessibility snapshots. Supports navigation, clicks, typing, screenshots, form filling, file uploads, and JavaScript execution.
  context7:
    command: npx
    args:
      - -y
      - '@upstash/context7-mcp'
    env:
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}
    description: Context7 MCP server (Upstash) — up-to-date library/framework API docs to eliminate LLM hallucinations. Resolution-based lookups for any version or commit (Unpkg-compatible projects only).
  chrome-devtools:
    command: npx
    args:
      - -y
      - chrome-devtools-mcp@latest
      - --no-usage-statistics
    description: Chrome DevTools MCP (official Google) — control and inspect real Chrome browser with performance profiling, network inspection, console access, DOM manipulation, and screenshots.
  citecheck:
    command: npx
    args:
      - -y
      - '@jhlee0619/citecheck'
    description: citecheck MCP server — automatically validate and fix references in academic papers. Extracts references from .tex/.md/.docx/.txt/.bib, validates against databases, and fixes inconsistencies. Supports arXiv/DOI/DBLP/ACL/custom APIs.
  mcp-pandoc:
    command: uvx
    args:
      - mcp-pandoc
    description: mcp-pandoc document format converter — use Pandoc to convert between Markdown/HTML/PDF/DOCX/RST/LaTeX/EPUB/TXT/IPYNB and more.
  markitdown:
    command: uvx
    args:
      - markitdown-mcp
    description: MarkItDown MCP server (Microsoft) — convert various file formats (PDF, DOCX, PPTX, XLSX, images via OCR, audio transcription, HTML, CSV, JSON, XML, ZIP) to Markdown.
  office-word-mcp:
    command: uvx
    args:
      - --from
      - office-word-mcp-server
      - word_mcp_server
    description: Office-Word-MCP server — create/read/edit Microsoft Word documents. Supports document management (create, merge, convert to PDF), content creation (headings, paragraphs, tables, images, page breaks), formatting (font, alignment, spacing), and comments.
  excel-mcp:
    command: npx
    args:
      - --yes
      - '@negokaz/excel-mcp-server'
    env:
      EXCEL_MCP_PAGING_CELLS_LIMIT: '4000'
    description: 'Excel MCP server — read/write MS Excel files. Supports reading/writing text values and formulas, creating worksheets/tables, copying worksheets, formatting cells (Windows: live editing + screenshots). Supports .xlsx/.xlsm/.xltx/.xltm. Free and open source.'
  pdf-toolkit:
    command: npx
    args:
      - -y
      - '@aryanbv/pdf-toolkit-mcp'
    description: 'PDF Toolkit MCP — 22-tool PDF suite: create PDFs from Markdown/structured data, render pages as images (for vision models to read scans), fill forms and extract values, split/merge/rotate/crop pages, add text/watermarks/annotations, extract and re-embed attachments.'
  arxiv:
    url: https://arxiv.mcp.brunosan.de/mcp
    description: arXiv paper search, download and reading for AI/ML/NLP/CV/robotics — free, no API key, uses the public arXiv API.
  crossref:
    command: npx
    args:
      - -y
      - '@cyanheads/crossref-mcp-server'
    description: Search and retrieve scholarly metadata from the Crossref REST API — 150M+ academic works, journals and funders; DOI resolution and reference lookup. No API key required.
  google-scholar:
    command: uvx
    args:
      - hasdata-google-scholar-mcp
    env:
      HASDATA_API_KEY: ${HASDATA_API_KEY}
    description: Google Scholar search results, citation counts and citation export formats, as structured JSON (HasData). Local stdio build; credential via HASDATA_API_KEY.
  desktop-commander:
    command: npx
    args:
      - -y
      - '@wonderwhy-er/desktop-commander@latest'
    description: 'Swiss-army-knife for your own machine: run terminal commands with streaming output, drive long-running and interactive processes, and read/write/search/edit files (diff-based surgical edits, ripgrep search, Excel/PDF/DOCX).'

rest-api:
  # `spec:` expands into `uvx mcp-openapi-proxy`; every endpoint becomes a tool.
  # `command:` uses a proxy of your own instead. A large spec is worth
  # `enabled: false`.
  github:
    spec: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.yaml
    base_url: https://api.github.com
    api_key: ${GITHUB_TOKEN}
    description: GitHub REST API via mcp-openapi-proxy — manage repos, issues, PRs, users, and more.
    enabled: false
  mcp-registry:
    spec: https://registry.modelcontextprotocol.io/openapi.json
    base_url: https://registry.modelcontextprotocol.io
    description: A community driven registry service for Model Context Protocol (MCP) servers. Provides APIs to list/search MCP servers, view server details, versions, and server.json metadata.

cli:
  # Programs already installed. Each entry is a catalogue row (`cli:<name>`)
  # and is not callable yet. `install` is shown when the command is missing.
  yt-dlp:
    command: yt-dlp
    description: 'yt-dlp is a powerful command-line video downloader supporting 1000+ sites including YouTube, Twitter/X, Bilibili, TikTok, etc. Common usage: yt-dlp <URL> to download best quality; yt-dlp -f "bestvideo+bestaudio" --merge-output-format mp4 <URL> for best quality merged MP4; yt-dlp --list-formats <URL> to list available formats; yt-dlp -f <format_id> <URL> for specific format. Supports cookies, subtitles, playlists, and more.'
    install: uv pip install yt-dlp
  browser-harness:
    command: browser-harness
    description: "Direct browser control via CDP — automation, scraping, testing, screenshots. Subcommands: browser-harness <<'PY' ... PY (run Python helpers like new_tab, page_info, capture_screenshot, click_at_xy, js, etc.), browser-harness --doctor (diagnose connection), browser-harness skill (print SKILL.md), browser-harness auth login (cloud auth), browser-harness telemetry disable."
    install: uv tool install --python 3.12 --upgrade --force browser-harness
    source:
      type: pypi
      url: https://pypi.org/project/browser-harness/
      version: 0.1.5
      description: Official browser-harness package

skills:
  # Playbooks live in skills/<name>/SKILL.md. This section supplies the
  # environment a skill declares in its header. Nothing runs the scripts yet;
  # `skill_use` reports a missing key before the model acts on it.
  baidu-search:
    env:
      BAIDU_API_KEY: ${BAIDU_API_KEY}

media:
  # `kind` is what a model is for: image, video, tts, asr. `api` selects the
  # wire adapter (`dashscope-aigc` or `openai-images`). A model of a kind its
  # adapter cannot serve is refused. `defaults` is used when a call names no
  # model; `params` and `voice` are the model's own defaults.
  defaults:
    image: bailian_personal/wan2.7-image
    video: bailian_personal/happyhorse-1.1-t2v
  providers:
    bailian_personal:
      api: dashscope-aigc
      base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/api/v1
      api_key: ${QWEN_TOKEN_PLAN_PERSONAL}
      models:
        - model: wan2.7-image
          kind: image
        - model: wan2.7-image-pro
          kind: image
        - model: qwen-image-3.0-pro
          kind: image
        - model: happyhorse-1.1-t2v
          kind: video
          params:
            resolution: 720P
            ratio: 16:9
            duration: 5
        - model: happyhorse-1.1-i2v
          kind: video
          params:
            resolution: 720P
            duration: 5
        - model: happyhorse-1.1-r2v
          kind: video
          params:
            resolution: 720P
            duration: 5
        - model: qwen-audio-3.0-tts-plus
          kind: tts
          voice: longanhuan_v3.6
        - model: qwen-audio-3.0-asr-flash
          kind: asr

file-tunnel:
  # Exactly one provider is active; the others stay configured and inert.
  # `expose_local_image` hands out a public URL served through this tunnel.
  # An unknown provider falls back to ngrok with a warning, and `tunnel_status`
  # reports the provider actually in use.
  active: cloudflare
  providers:
    ngrok:
      token: ${NGROK_AUTHTOKEN}
    localhost.run:
      binary: ${SSH_BINARY:-ssh}
      host: localhost.run
      user: nokey
      remote_port: 80
    cloudflare:
      binary: ${CLOUDFLARED_BINARY:-cloudflared}
      # cloudflared defaults to quic; http2 avoids QUIC failures behind a
      # proxy or TUN adapter.
      protocol: ${CLOUDFLARED_PROTOCOL:-http2}

peer_agent:
  # The peer network is enabled by this section's presence. `broker` names
  # another machine's broker; left out, the subagent network's address is used.
  # A local broker is started when absent, and stopped by the last instance out
  # or `slife2 down` only if slife2 started it.
  #
  # `provider: mosquitto` is the only supported broker; `org` and `unit` are the
  # topic namespace that tells two groups on one broker apart.
  provider: mosquitto
  # broker: {host: localhost, port: 1883}
  org: default
  unit: default

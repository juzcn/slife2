# slife2.yaml — one config file, read by every process and by the launcher.
#
# This is the *working* config: the providers listed here are the ones this
# machine can actually reach.  With no file at all slife2 falls back to a single
# built-in OpenAI-compatible provider, which is what a fresh checkout starts
# with — so deleting this file changes behaviour, on purpose.
#
# It is safe to check in: it holds no secrets.  Every ${VAR} resolves through
# shell env -> credstore -> literal default, so keys live in the credential
# store (`credstore set DEEPSEEK_API_KEY`), never here.  An unresolved reference
# is left verbatim rather than raising, so a missing key fails at the API call —
# where the message can name it — rather than at startup.
#
# ── Providers ───────────────────────────────────────────────────────────────
# One entry per provider.  `api` selects the wire protocol, and `base_url` /
# `api_key` / `server` are shared by every model listed under it:
#
#   openai-completions   OpenAI / DeepSeek / Ollama / MiniMax
#   anthropic-messages   Claude / Bailian (Qwen)
#
# slife2 starts the servers its config needs, on demand, and shares them between
# instances.
#
# ── Models ──────────────────────────────────────────────────────────────────
# Each model entry:
#   model                 API model name; doubles as the local id, referenced
#                         elsewhere as "provider/model"
#   name                  display label for the status bar and logs
#   reasoning             the model thinks natively
#   input                 modalities accepted; list image only for vision models
#   context_window        token budget, shown as a percentage in the status bar
#   max_tokens            output cap
#   temperature / top_p   sampling; omitted means the gateway's default
#   compat.thinking       omit  — send no thinking field (for gateways that
#                                 reject the standard shape yet reason natively)
#                         disabled / enabled are also accepted
#
# An omitted sampling field is *not* the same as a default value: it means send
# nothing and let the gateway decide.  Several gateways reject a temperature
# they did not ask for.

# ── The servers ─────────────────────────────────────────────────────────────
# One address per *wire protocol*, not per provider: a process speaks one
# format, so every OpenAI-compatible provider is served by the same process and
# `stream_chat(provider=..., model=...)` says whose credentials to use.  A
# protocol no provider uses is not started — it would be a process holding
# nobody's key.
servers:
  agent:
    host: 127.0.0.1
    port: 8000
    path: /mcp
  openai-completions:
    host: 127.0.0.1
    port: 8001
    path: /mcp
  anthropic-messages:
    host: 127.0.0.1
    port: 8002
    path: /mcp

providers:
  deepseek:
    api: openai-completions
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}
    models:
      - model: deepseek-flash
        name: DeepSeek Flash
        reasoning: true
        input:
          - text
          - image
        context_window: 1000000
        max_tokens: 384000
        temperature: 0.7
        top_p: 1.0

  scnet:
    api: openai-completions
    base_url: https://api.scnet.cn/api/llm/v1
    api_key: ${SCNET_TOKEN_PLAN}
    models:
      - model: DeepSeek-V4
        name: DeepSeek V4 Pro
        reasoning: true
        input:
          - text
        context_window: 1000000
        max_tokens: 384000
        temperature: 0.7
        top_p: 1.0
      - model: Kimi-K3
        name: Kimi K3
        reasoning: true
        input:
          - text
          - image
        context_window: 1048576
        max_tokens: 131072
        # This gateway rejects the standard thinking shape while reasoning
        # anyway, so the field is left out entirely.
        compat:
          thinking: omit

  bailian:
    api: anthropic-messages
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/apps/anthropic
    api_key: ${QWEN_TOKEN_PLAN_PERSONAL}
    models:
      - model: qwen3.8-max
        name: Qwen3.8 Max
        reasoning: true
        input:
          - text
          - image
        context_window: 983616
        max_tokens: 131072

# Which model the agent starts with, as "provider/model".
default: deepseek/deepseek-flash

# ── The agent loop ──────────────────────────────────────────────────────────
agent:
  # Model calls allowed in one turn before it is cut off.  A model that keeps
  # calling tools would otherwise run indefinitely; the cap ends the turn
  # normally rather than raising.
  max_steps: 16
  # The system prompt is a Jinja2 template, rendered per turn with the agent
  # name — `run_turn(..., agent="jack")` reaches it — because the server is
  # shared and stateless, so two instances on one server are two names asking
  # the same process.
  #
  # Left out, the template the distribution ships is used.  A path here is
  # looked for relative to this file, which is the useful place for one you are
  # editing:
  #
  #   system_prompt: "prompts/jack.j2"
  #
  # Inside it, `{{ agent_name }}` is the name the instance was started with.

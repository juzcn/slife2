# slife2.yaml — one config file, read by every process and by the launcher.
#
# This is the *working* config: the providers listed here are the ones this
# machine can actually reach.  With no file at all slife2 falls back to a single
# built-in OpenAI-compatible provider, which is what a fresh checkout starts
# with — so deleting this file changes behaviour, on purpose.
#
# It is safe to check in: it holds no secrets.  Every ${VAR} resolves through
# shell env -> credstore -> literal default, so keys live in the credential
# store (`credstore set DEEPSEEK_API_KEY`), never here.  An unresolved reference
# is left verbatim rather than raising, so a missing key fails at the API call —
# where the message can name it — rather than at startup.
#
# ── Providers ───────────────────────────────────────────────────────────────
# One entry per provider.  `api` selects the wire protocol, and `base_url` /
# `api_key` / `server` are shared by every model listed under it:
#
#   openai-completions   OpenAI / DeepSeek / Ollama / MiniMax
#   anthropic-messages   Claude / Bailian (Qwen)
#   openai-responses     OpenAI's newer Responses API — a different protocol
#                        from the chat-completions one above, not a flag on it,
#                        so it is served by a process of its own
#
# slife2 starts the servers its config needs, on demand, and shares them between
# instances.
#
# ── Models ──────────────────────────────────────────────────────────────────
# Each model entry:
#   model                 API model name; doubles as the local id, referenced
#                         elsewhere as "provider/model"
#   name                  display label for the status bar and logs
#   reasoning             the model thinks natively.  On an openai-completions
#                         wire that also means its reasoning is kept on the turn
#                         and re-sent to it as `reasoning_content` — which the
#                         DeepSeek reasoners require on every assistant message
#                         once thinking has been asked for
#   input                 modalities accepted; list image only for vision models
#   context_window        token budget, shown as a percentage in the status bar
#   max_tokens            output cap
#   temperature / top_p   sampling; omitted means the gateway's default
#   compat.thinking       omit  — send no thinking field (for gateways that
#                                 reject the standard shape yet reason natively)
#                         disabled / enabled are also accepted
#   compat.stream_usage   omit  — send no `stream_options`, for a gateway that
#                                 rejects OpenAI's usage extension with a 400.
#                                 Leaving it out *sends* it (not the other way
#                                 round, as with store): the token counts the
#                                 status bar shows arrive only when asked for.
#   compat.store          openai-responses only: whether the provider may keep
#                         the response on its side.  Leave it out and slife2
#                         sends nothing, which leaves that provider's own
#                         default in place — the right answer when you do not
#                         know how much of the API a gateway implements.
#                         false / true send the field explicitly.
#
# An omitted sampling field is *not* the same as a default value: it means send
# nothing and let the gateway decide.  Several gateways reject a temperature
# they did not ask for.

# ── The servers ─────────────────────────────────────────────────────────────
# One address per *wire protocol*, not per provider: a process speaks one
# format, so every OpenAI-compatible provider is served by the same process and
# `stream_chat(provider=..., model=...)` says whose credentials to use.  A
# protocol no provider uses is not started — it would be a process holding
# nobody's key.
servers:
  agent:
    host: 127.0.0.1
    port: 8000
    path: /mcp
  openai-completions:
    host: 127.0.0.1
    port: 8001
    path: /mcp
  anthropic-messages:
    host: 127.0.0.1
    port: 8002
    path: /mcp
  openai-responses:
    host: 127.0.0.1
    port: 8003
    path: /mcp
  # Embeddings, for the db's vector index.  A process of its own, and *not* one
  # of the three above: those are chat protocols built from the `providers:`
  # below, and an embedding endpoint speaks neither — it is configured under
  # `embeddings:` at the bottom of this file.  It starts before `context`, which asks
  # it for a dimension before it can build an index at all.
  embeddings:
    host: 127.0.0.1
    port: 8004
    path: /mcp
  # A conversation's memory: the turn log, and the decision about which of its
  # turns a turn runs on.  One database per `(agent, subagent)`, at
  # `<data>/agents/<agent>/turns.db`, a worker's beside its parent's.
  # Its settings are the `context:` section below.
  context:
    host: 127.0.0.1
    port: 8010
    path: /mcp
  # The playbooks: `<data>/skills/`, one directory per skill, each with a
  # `SKILL.md`.  It serves `skill_use` — the tool that reads one — and one
  # catalogue row per installed skill, so that a search finds a playbook by what
  # it is for.  A skill is a document and not a tool, so the row is not
  # callable; the tool that *is* is `skill_use`.
  skills-server:
    host: 127.0.0.1
    port: 8031
    path: /mcp
  # The programs the `cli:` section below records as already on this machine.
  # Nothing here runs one yet (see DESIGN.md §9): what this server serves today
  # is one catalogue row per entry, so that a search finds a command by what it
  # does.  Its key carries `-server` because `cli` is the catalogue source its
  # rows belong to, and a source's rows cannot share an id with the tools of the
  # server that publishes them.
  cli-server:
    host: 127.0.0.1
    port: 8032
    path: /mcp
  # WeChat, over the iLink bridge.  Not a family: it declares no catalogue rows
  # and has no section of entries — what it holds is a login per agent and the
  # conversation that login is in.  Its tools are the model's under their own
  # names (`wechat_login`, `wechat_send_message`), because there is one set of
  # tools here and the plugin serving one is not something the model reasons
  # about.  Port 8030, which v1's `builtins` had and nothing has had since.
  wechat:
    host: 127.0.0.1
    port: 8030
    path: /mcp
  # The private cabinet: notes, a diary, saved files, reports — the four kinds
  # are one searchable corpus, and each agent's is its own directory
  # (`<data>/agents/<agent>/cabinet/`) with markdown mirrors a person can read.
  # Like
  # `wechat`, it reads no config section at all: a cabinet is written, not
  # configured.  Its bytes and mirrors live beside the data, not in a database
  # anyone has to open.
  cabinet:
    host: 127.0.0.1
    port: 8035
    path: /mcp
  # Generation: images, video, speech and transcripts, from the `media:` section
  # at the bottom of this file.  One process for every provider, because which
  # vendor draws a picture is a fact about a *model* and not about a process —
  # the same arrangement as the model backends, and for the same reason.
  media:
    host: 127.0.0.1
    port: 8036
    path: /mcp
  # A public HTTPS URL for a local file, so something that cannot read this
  # machine's disk — a vision model asked about a picture, an API that takes
  # links and nothing else — can still fetch one.  The tunnel provider is the
  # `file-tunnel:` section at the bottom of this file.
  #
  # The one server here that answers a second HTTP route: `GET /share/<token>`
  # beside `/mcp`, on this same port, because the far end fetches that path
  # *through* the tunnel.  Nothing else about it is unusual — which is why it
  # is a plugin on this list and not a mechanism of its own.
  file-tunnel:
    host: 127.0.0.1
    port: 8038
    path: /mcp
  # The terminal's own inbox.  One process, shared like every other server here,
  # holding a session per agent: a message arriving on another channel is handed
  # to it by name, and it puts the words down the stream the window showing that
  # conversation holds open — so they become the one thing a window already
  # handles, something the person typed.  `slife2-wechat` is the caller today
  # (DESIGN.md §1.2).  It reads no section of its own: an address is the whole of
  # what is written down about it.
  tui:
    host: 127.0.0.1
    port: 8005
    path: /mcp
  # Other people's servers, held by the process that owns the section they are
  # written in: `tools:` by this one, `rest-api:` by the next.  Neither offers
  # the model anything — each holds its entries' connections and *declares* them
  # to the hub, which merges the rows and routes the calls back.  What that buys
  # is that the hub keeps the tool set and no link to anybody.
  mcp-tools:
    host: 127.0.0.1
    port: 8033
    path: /mcp
  restapi-tools:
    host: 127.0.0.1
    port: 8034
    path: /mcp
  # The tool *set*: which tools the model may call, what they are named, what
  # the budget takes back — and the only process that decides it.  It holds no
  # connection to anybody's server, and reads no config section but this one.
  toolhub:
    host: 127.0.0.1
    port: 8020
    path: /mcp
  # The background tasks: a loop of the calling agent's own, one per task,
  # answered later by a message in the conversation that asked for it.  A plugin
  # because what it holds is loops — the same reason the agent server is one —
  # and unlike every other address here it *reaches* its peers rather than being
  # reached by them: the hub for a tool list, a model server for the loop, and
  # the terminal (or, when no window is showing, the agent server) to hand the
  # answer over.  Its own section is `agent-task:` below, and it holds one key.
  agent-task:
    host: 127.0.0.1
    port: 8037
    path: /mcp

# ── External tool servers ───────────────────────────────────────────────────
# Other people's MCP servers, held by `slife2-mcp-tools` — which is why they
# are `tools:` and not `servers:`.  The difference matters: `servers:` above is
# *our* plugins, which slife2 starts, shares and stops, and a missing one is
# a system that has come apart.  An entry here is somebody else's process; if it
# is slow, paid or down, the hub says so through its `servers` tool and the
# model simply has fewer tools, while the conversation keeps working.
#
# Every tool here arrives as `{name}__{tool}` — so `filesystem` below offers
# `filesystem__read_file` — and the name is what the model calls.  The prefix is
# what keeps two servers' tools apart, and it is for entries *here*: a plugin's
# tools are the model's under their own names (`turn_read`, `skill_use`),
# because
# there is one set of tools in this system and the plugin serving one is not
# something the model needs to reason about.
#
#   command + args + env     stdio: a process slife2 starts
#   url + headers            http: an endpoint somebody else runs
#   cwd                      stdio only; defaults to the data directory, which
#                            is what the `.` in an argument means
#   description              what it is for; for a person, not for the model —
#                            the model reads the descriptions the server itself
#                            gives each tool
#   enabled: false           stays configured, is never connected
#   autoload: true           every tool this server offers is in the model's
#                            tool list from the start, and is never evicted.
#                            Without it they are on demand: the model finds one
#                            with `tool_search` and puts it in its list with
#                            `func_tool_load`.  Worth setting for a server whose
#                            tools are wanted every turn, and worth *not*
#                            setting for one with ninety of them
#
# `env` and `headers` are the two places a tool server is handed a credential,
# and both go through the same chain as a provider key: ${VAR} resolves through
# shell env -> credstore -> literal default.
#
# **Everything enabled here is connected when slife2 starts**, so the list is
# the budget.  `enabled: false` is how a server stays configured without being
# one of the processes at every start, and it is worth using: an entry that is
# on is a process, a handshake, and its tools in every turn's list.
tools:
  # Local filesystem operations — read, write, list, and search files within
  # allowed directories.  Off by default: `.` below is the *data directory*, so
  # turning it on gives the model the config, the runtime state and the turn
  # databases.  Point it at something narrower if that is not what you want.
  serper:
    command: npx
    args:
      - -y
      - serper-search-scrape-mcp-server
    env:
      SERPER_API_KEY: ${SERPER_API_KEY}
    description: Google web search via Serper — search the web and scrape result pages.
  fetch:
    command: uvx
    args:
      - --with
      - mcp>=1.0,<1.29
      - mcp-server-fetch
    description: Fetch and convert web pages to markdown. Pins mcp<1.29 for McpError compatibility.
  tavily-mcp:
    command: npx
    args:
      - -y
      - tavily-mcp@latest
    env:
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    description: Tavily AI-optimized web search — designed for LLM agents, returns clean structured results.
  duckduckgo-search:
    command: uvx
    args:
      - --with
      - duckduckgo-mcp-server[browser]
      - duckduckgo-mcp-server
      - --fetch-backend
      - auto
      - --search-backend
      - auto
    description: DuckDuckGo search MCP server — web search and content extraction via DuckDuckGo.
  amap-maps:
    command: npx
    args:
      - -y
      - '@amap/amap-maps-mcp-server'
    env:
      AMAP_MAPS_API_KEY: ${AMAP_MAPS_API_KEY}
    description: 高德地图官方 MCP Server，提供地理编码、逆地理编码、IP定位、天气查询、骑行/步行/驾车/公交路径规划、距离测量、关键词/周边/详情POI搜索、专属地图、输入提示、搜索提示、矩形区域交通态势、路径信息、距离测量等多种地图和位置服务。免费，需要申请 Web服务 API Key。
  # v1 ran this with `os_paths: true`, which injected `--allow-path` for the
  # OS-accessible path set.  slife2 has no equivalent, so it starts confined to
  # the data directory — which is a different tool from the one v1 ran, and the
  # reason it is off.
  playwright:
    command: npx
    args:
      - -y
      - '@playwright/mcp@latest'
      - --headless
    description: Playwright MCP server (official Microsoft) — headless browser automation via accessibility snapshots. Supports navigation, clicks, typing, screenshots, form filling, file uploads, and JavaScript execution.
  context7:
    command: npx
    args:
      - -y
      - '@upstash/context7-mcp'
    env:
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}
    description: Context7 MCP server (Upstash) — up-to-date library/framework API docs to eliminate LLM hallucinations. Resolution-based lookups for any version or commit (Unpkg-compatible projects only).
  chrome-devtools:
    command: npx
    args:
      - -y
      - chrome-devtools-mcp@latest
      - --no-usage-statistics
    description: Chrome DevTools MCP (official Google) — control and inspect real Chrome browser with performance profiling, network inspection, console access, DOM manipulation, and screenshots.
  citecheck:
    command: npx
    args:
      - -y
      - '@jhlee0619/citecheck'
    description: citecheck MCP server — automatically validate and fix references in academic papers. Extracts references from .tex/.md/.docx/.txt/.bib, validates against databases, and fixes inconsistencies. Supports arXiv/DOI/DBLP/ACL/custom APIs.
  mcp-pandoc:
    command: uvx
    args:
      - mcp-pandoc
    description: mcp-pandoc document format converter — use Pandoc to convert between Markdown/HTML/PDF/DOCX/RST/LaTeX/EPUB/TXT/IPYNB and more.
  markitdown:
    command: uvx
    args:
      - markitdown-mcp
    description: MarkItDown MCP server (Microsoft) — convert various file formats (PDF, DOCX, PPTX, XLSX, images via OCR, audio transcription, HTML, CSV, JSON, XML, ZIP) to Markdown.
  office-word-mcp:
    command: uvx
    args:
      - --from
      - office-word-mcp-server
      - word_mcp_server
    description: Office-Word-MCP server — create/read/edit Microsoft Word documents. Supports document management (create, merge, convert to PDF), content creation (headings, paragraphs, tables, images, page breaks), formatting (font, alignment, spacing), and comments.
  excel-mcp:
    command: npx
    args:
      - --yes
      - '@negokaz/excel-mcp-server'
    env:
      EXCEL_MCP_PAGING_CELLS_LIMIT: '4000'
    description: 'Excel MCP server — read/write MS Excel files. Supports reading/writing text values and formulas, creating worksheets/tables, copying worksheets, formatting cells (Windows: live editing + screenshots). Supports .xlsx/.xlsm/.xltx/.xltm. Free and open source.'
  pdf-toolkit:
    command: npx
    args:
      - -y
      - '@aryanbv/pdf-toolkit-mcp'
    description: 'PDF Toolkit MCP — 22-tool PDF suite: create PDFs from Markdown/structured data, render pages as images (for vision models to read scans), fill forms and extract values, split/merge/rotate/crop pages, add text/watermarks/annotations, extract and re-embed attachments.'
  arxiv:
    url: https://arxiv.mcp.brunosan.de/mcp
    description: arXiv paper search, download and reading for AI/ML/NLP/CV/robotics — free, no API key, uses the public arXiv API.
  crossref:
    command: npx
    args:
      - -y
      - '@cyanheads/crossref-mcp-server'
    description: Search and retrieve scholarly metadata from the Crossref REST API — 150M+ academic works, journals and funders; DOI resolution and reference lookup. No API key required.
  google-scholar:
    command: uvx
    args:
      - hasdata-google-scholar-mcp
    env:
      HASDATA_API_KEY: ${HASDATA_API_KEY}
    description: Google Scholar search results, citation counts and citation export formats, as structured JSON (HasData). Local stdio build; credential via HASDATA_API_KEY.

# ── REST APIs as tools ──────────────────────────────────────────────────────
# The same thing said a shorter way.  Writing `spec:` gets the standard
# OpenAPI-to-MCP proxy (`uvx mcp-openapi-proxy`) with the environment it reads
# filled in from this entry, and every endpoint in the document becomes a tool.
# Writing `command:` instead gets a proxy of your own — a pinned version, a
# private fork — for the cases the standard one does not cover.
#
# It is the *same mechanism* either way: an entry here is expanded into the
# stdio server it describes before anything connects to it, so the toolhub does
# not know that REST exists.
#
#   spec        the OpenAPI document, a URL or a path
#   base_url    overrides the server the document names (SERVER_URL_OVERRIDE)
#   api_key     sent as the API_KEY the proxy reads; usually ${VAR}
#
# A spec is a large document and these proxies generate a tool per endpoint, so
# one entry here can outweigh every other server in the list.  That is what
# `enabled: false` is for.
  desktop-commander:
    command: npx
    args:
      - -y
      - '@wonderwhy-er/desktop-commander@latest'
    description: 'Swiss-army-knife for your own machine: run terminal commands with streaming output, drive long-running and interactive processes, and read/write/search/edit files (diff-based surgical edits, ripgrep search, Excel/PDF/DOCX).'
rest-api:
  github:
    spec: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.yaml
    base_url: https://api.github.com
    api_key: ${GITHUB_TOKEN}
    description: GitHub REST API via mcp-openapi-proxy — manage repos, issues, PRs, users, and more.
    enabled: false
  mcp-registry:
    spec: https://registry.modelcontextprotocol.io/openapi.json
    base_url: https://registry.modelcontextprotocol.io
    description: A community driven registry service for Model Context Protocol (MCP) servers. Provides APIs to list/search MCP servers, view server details, versions, and server.json metadata.

# ── Commands already on this machine ────────────────────────────────────────
# Neither of the two above, because there is nothing here for slife2 to start or
# connect to: a `cli:` entry is a program that is already installed, written
# down so the model can be told it exists.  No process, no URL, no credential.
#
#   command       the invocation, resolved on PATH.  One string, and it may be
#                 more than one word (`python -m mytool`).  Required.
#   description   what it is for, in your words — this is the description the
#                 model reads, so say what it does and how it is called
#   install       how to get it; what is shown when the command is missing
#   source        where the entry came from (url / type / version).  For you,
#                 a year from now; nothing reads it
#   enabled       false keeps the entry written down and out of the model's
#                 hands — the same switch, with the same meaning, as on a server
#
# The entry is the opt-in, exactly as an entry under `tools:` is: what is here
# is what the model may be given, and there is no registry a model writes.
#
# Every entry is a row in the tool catalogue, named `cli:<name>`, so the model
# finds it with `tool_search` by what it does rather than by its name.  Nothing
# *runs* one yet (`func_tool_load` says so, and DESIGN.md §9 is the change that
# would) — being findable is the half that landed, and a command is not a tool
# that could be loaded either way.
#
# The matching shape for a *playbook* rather than a command is the `skills/`
# directory beside this file — one directory per skill, each with a SKILL.md.
# Same family, written to be read instead of run — and catalogued the same way,
# as `skill:<name>`, which is how a search reaches a playbook by what it is
# about.
# ── What a skill is given ───────────────────────────────────────────────────
# The playbooks in `skills/` are read, not run — but a playbook that says
# "run scripts/search.py" is worth nothing if that script dies on a missing API
# key, and the skill's own header says which names it needs:
#
#   metadata: {"openclaw": {"requires": {"env": ["BAIDU_API_KEY"]}}}
#
# This section is the other half: where the value comes from.  It is the same
# chain as a provider key — shell env -> credstore -> literal — which is the
# point of writing it down.  A daemon started days ago never saw the key you
# exported this morning, and a `keyring:...` value is not an environment
# variable in the first place; an entry here is what turns either into what the
# skill's script gets handed.
#
# A skill with no entry here is not misconfigured — the ambient environment is
# a real answer, and a playbook that needs nothing is the common case.  Nothing
# runs these scripts yet (DESIGN.md §9), so today this is what `skill_use`
# reads to tell the model whether the skill it just read can actually work.
# ── How many tools the model may hold at once ───────────────────────────────
# The tools the model has loaded go out with *every* request, so the set is
# bounded: over this many function tools, the least recently *called* are
# unloaded again — before a turn is saved, by the harness, which is the moment
# nothing is in flight.  A tool that has never been called since it was loaded
# is ordered by when it was loaded, so a tool just brought in is not the first
# to go either.  Nothing of slife2's own is ever evicted (`tool_search`,
# `func_tool_load`, `skill_use`, `_func_tool_unload`), and neither is anything
# from a server marked `autoload: true`.
#
# Being evicted costs a `tool_search` and a `func_tool_load`, not a capability —
# and 100 is v1's number, arrived at by watching a real tool set.
tool_load:
  threshold: 100

# ── Context ───────────────────────────────────────────────────────────────────
# How a conversation's context is decided.  `slife2-context` owns the turn log
# and, before every turn, makes **one model call** that reads the conversation
# in hand and answers with what to keep of it plus what to recall from the log;
# the turn runs on the two together.  This is v1's mechanism, ported, and the
# reasons are in DESIGN.md §5.1.
#
# `ceiling` and `floor` are **fractions of the model's own context window**, so
# they only mean anything for a model whose config declares one.  The ceiling is
# what a kept context is measured against — a recall's budget is the headroom
# below it — and the floor is the size a recall may spend when nothing was kept.
#
# `min_similarity` gates only a similarity the store actually *measured*: a turn
# found by the keyword leg has no number to compare, and an exact match is a
# stronger signal than a cosine neighbourhood.  `timeout` bounds the
# discriminator call; past it the turn runs on the context it already has, which
# is the fallback for every way that call can fail, not an error.
context:
  ceiling: 0.8
  floor: 0.2
  recall_limit: 40
  min_similarity: 0.45
  timeout: 20.0

# ── WeChat ──────────────────────────────────────────────────────────────────
# **There is no `wechat:` section, and that is the design.**  WeChat is always
# on — a login cannot be configured, it is *scanned*: `wechat_login` puts a QR
# code in front of somebody, and the token that comes back lives in
# `<data>/agents/<agent>/wechat.yaml`, written by the plugin and read by
# it at the next start.  Those files are also how a shared process knows which
# agents exist, so a section here would be a second answer to a question the
# files already answer.  A machine that should not talk to WeChat is a machine
# where nobody scans a code.
#
# The one thing written down about it is the address above, under `servers:`,
# and there is nothing else to say about it — no entries, no switch, no keys.
# See README.md's "WeChat" section, and DESIGN.md §1.2 for why this plugin owns
# no section at all.

skills:
  baidu-search:
    env:
      # `credstore set BAIDU_API_KEY`, or export it — both resolve here.
      BAIDU_API_KEY: ${BAIDU_API_KEY}

cli:
  yt-dlp:
    command: yt-dlp
    description: 'yt-dlp is a powerful command-line video downloader supporting 1000+ sites including YouTube, Twitter/X, Bilibili, TikTok, etc. Common usage: yt-dlp <URL> to download best quality; yt-dlp -f "bestvideo+bestaudio" --merge-output-format mp4 <URL> for best quality merged MP4; yt-dlp --list-formats <URL> to list available formats; yt-dlp -f <format_id> <URL> for specific format. Supports cookies, subtitles, playlists, and more.'
    install: uv pip install yt-dlp
  browser-harness:
    command: browser-harness
    description: "Direct browser control via CDP — automation, scraping, testing, screenshots. Subcommands: browser-harness <<'PY' ... PY (run Python helpers like new_tab, page_info, capture_screenshot, click_at_xy, js, etc.), browser-harness --doctor (diagnose connection), browser-harness skill (print SKILL.md), browser-harness auth login (cloud auth), browser-harness telemetry disable."
    install: uv tool install --python 3.12 --upgrade --force browser-harness
    source:
      type: pypi
      url: https://pypi.org/project/browser-harness/
      version: 0.1.5
      description: Official browser-harness package

providers:
  deepseek:
    api: openai-completions
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}
    models:
      - model: deepseek-flash
        name: DeepSeek Flash
        reasoning: true
        input:
          - text
          - image
        context_window: 1000000
        max_tokens: 384000
        temperature: 0.7
        top_p: 1.0

  scnet:
    api: openai-completions
    base_url: https://api.scnet.cn/api/llm/v1
    api_key: ${SCNET_TOKEN_PLAN}
    models:
      - model: DeepSeek-V4
        name: DeepSeek V4 Pro
        reasoning: true
        input:
          - text
        context_window: 1000000
        max_tokens: 384000
        temperature: 0.7
        top_p: 1.0
      - model: Kimi-K3
        name: Kimi K3
        reasoning: true
        input:
          - text
          - image
        context_window: 1048576
        max_tokens: 131072
        # This gateway rejects the standard thinking shape while reasoning
        # anyway, so the field is left out entirely.
        compat:
          thinking: omit

  bailian:
    api: anthropic-messages
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/apps/anthropic
    api_key: ${QWEN_TOKEN_PLAN_PERSONAL}
    models:
      - model: qwen3.8-max
        name: Qwen3.8 Max
        reasoning: true
        input:
          - text
          - image
        context_window: 983616
        max_tokens: 131072

  # Nothing here speaks the Responses API yet, so the block above is what
  # actually runs.  A provider for it looks like this — note that it is a
  # separate provider entry, not a change to `deepseek`, because the protocol
  # decides which process serves it:
  #
  # openai:
  #   api: openai-responses
  #   base_url: https://api.openai.com/v1
  #   api_key: ${OPENAI_API_KEY}
  #   models:
  #     - model: gpt-5.1
  #       name: GPT-5.1
  #       reasoning: true
  #       input: [text, image]
  #       context_window: 400000
  #       max_tokens: 128000
  #       compat:
  #         # Only if this endpoint rejects the field; see the note above.
  #         store: false

# Which model the agent starts with, as "provider/model".
default: deepseek/deepseek-flash

# ── The agent loop ──────────────────────────────────────────────────────────
agent:
  # Model calls allowed in one turn before it is cut off.  A model that keeps
  # calling tools would otherwise run indefinitely; the cap ends the turn
  # normally rather than raising.
  max_steps: 16
  # The system prompt is a Jinja2 template, rendered per turn with the agent
  # name — `run_turn(..., agent="jack")` reaches it — because the server is
  # shared and stateless, so two instances on one server are two names asking
  # the same process.
  #
  # Left out, the template the distribution ships is used.  A path here is
  # looked for relative to this file, which is the useful place for one you are
  # editing:
  #
  #   system_prompt: "prompts/jack.j2"
  #
  # Inside it, `{{ agent_name }}` is the name the instance was started with.

# ── Background tasks ────────────────────────────────────────────────────────
# How many agent tasks one agent may have running at once.  An **agent task** is
# a loop of the agent's own — the same system prompt, the same model and the
# same tools, and none of the asking conversation's history — started by the
# model with a name and a description, and answered later by a message on the
# `agent-task` channel.  The model has four tools over them —
# `agent_task_start`, `agent_task_status`, `agent_task_list` and
# `agent_task_cancel` — and not one of them waits for the work (DESIGN.md §1.3).
#
# **`max_running` is the only key a task owns, and that is the design.**  A
# task's prompt and its step count come out of `agent:` above, because a task is
# the agent working: `agent:` is the one section in this file with two readers,
# and a prompt or a step count that meant something different for a task would
# be two agents wearing one name.
agent-task:
  # Tasks running at once, per agent.  A cap rather than a preference, and the
  # only bound this feature has: the tool set is the one catalogue and nothing
  # filters it, so a task may start a task — without this a model can grow loops
  # without limit.  What it does *not* bound is how much work happens over time;
  # `agent_task_list` and `agent_task_cancel` are what make a runaway visible
  # and stoppable in the meantime, and DESIGN.md §9 holds the number that is
  # still missing.
  max_running: 4

# ── Embeddings (semantic memory search) ─────────────────────────────────────
# Where the db's vectors come from.  **A section of its own, holding only
# OpenAI-compatible URLs**: each provider is a base_url, a key and the single
# model id sent on `/v1/embeddings` — and none of them is one of the
# `providers:` above, because an embedding endpoint speaks no chat protocol and
# a chat backend built from those providers has no model to serve it with.
#
# The vector dimension is **never configured**.  It is discovered from the
# endpoint at runtime — a table of known models first, then the endpoint's own
# model listing, then a probe embedding whose length is the answer.  That is not
# a convenience: the vector table fixes its width in its DDL and cannot be
# altered afterwards, so the number has to be right before the table exists.
#
# There is deliberately **no `enabled` switch**.  A turn is stored with its
# vector in one transaction, so an embedding model is not an extra the db can do
# without — it is what lets the db record a turn at all.  Changing the model is
# the supported change, and its cost is that the vector index is rebuilt whole
# on the next start: every turn embedded again, because vectors from two models
# cannot be ranked against each other.
embeddings:
  providers:
    # A local embedding service: no credential and no network, and it outlives
    # whatever vendor is current.  `bge-m3` is multilingual, which is what a
    # history mixing Chinese and English needs.  It has to be running already —
    # it is a separate installation, not a process slife2 starts.
    local:
      base_url: http://127.0.0.1:17347/v1
      model: bge-m3
      api_key: local
    # The same weights served by somebody else, for a machine without the local
    # service.  Needs SILICONFLOW_API_KEY.
    siliconflow:
      base_url: https://api.siliconflow.cn/v1
      model: BAAI/bge-m3
      api_key: ${SILICONFLOW_API_KEY}
  # A provider id, not a "provider/model" reference: there is one model per
  # endpoint here, so the endpoint is the choice being made.  A value naming
  # nothing falls back to the first provider.
  active_model: siliconflow

# ── Generation (images, video, speech, transcripts) ─────────────────────────
# A provider table like `providers:`, with one difference that matters: an entry
# declares what each of its models is *for* (`kind:`), because "which model
# draws pictures" is a fact about a model rather than about a vendor.  The four
# kinds are `image`, `video`, `tts` and `asr`.
#
# `api:` selects the wire adapter, not a brand: today `dashscope-aigc` (Bailian
# / DashScope: images, video, speech and transcription) and `openai-images` (an
# OpenAI-compatible `/images/generations`, which draws pictures and nothing
# else).  A model of a kind its adapter cannot do is refused with a sentence
# naming the adapter, rather than failing at the vendor.
#
# `defaults:` is which model a call gets when it names none — a `provider/model`
# reference.  A call may still name its own, and a stale entry here falls
# through to the first model of that kind rather than stopping the call.
#
# `params:` is the model's own defaults (a resolution, a ratio, a duration),
# merged *under* whatever the call passes; `voice:` is the same for speech.
# `api_key:` resolves through the usual chain — `${VAR}` from the shell, then
# credstore — and a key that does not resolve is reported when a call needs it.
#
# Generated files are written under `<data>/media/` and nowhere else: they are
# work products rather than cabinet documents, nothing registers them, and the
# answer is a path somebody can open.
media:
  defaults:
    image: bailian_personal/wan2.7-image
    video: bailian_personal/happyhorse-1.1-t2v
  providers:
    bailian_personal:
      api: dashscope-aigc
      base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/api/v1
      api_key: ${QWEN_TOKEN_PLAN_PERSONAL}
      models:
        - model: wan2.7-image
          kind: image
        - model: wan2.7-image-pro
          kind: image
        - model: qwen-image-3.0-pro
          kind: image
        - model: happyhorse-1.1-t2v
          kind: video
          params:
            resolution: 720P
            ratio: 16:9
            duration: 5
        - model: happyhorse-1.1-i2v
          kind: video
          params:
            resolution: 720P
            duration: 5
        - model: happyhorse-1.1-r2v
          kind: video
          params:
            resolution: 720P
            duration: 5
        - model: qwen-audio-3.0-tts-plus
          kind: tts
          voice: longanhuan_v3.6
        - model: qwen-audio-3.0-asr-flash
          kind: asr

# ── A public URL for a local file ───────────────────────────────────────────
# The ACTIVE tunnel provider exposes this machine's `file-tunnel` port
# (8038 above) as a public HTTPS URL; `expose_local_image` hands that URL out,
# and `GET /share/<token>` on the same port serves the bytes.
#
# Provider options support `${VAR}` / `${VAR:-default}`, resolved through the
# shell env → credstore → literal default, like every other value in this file.
#
# Providers differ in what they need and in what a *browser* sees:
#
#   ngrok          Needs an NGROK_AUTHTOKEN credential (credstore, or the env
#                  var).  One stable dev domain per account.  On the FREE tier
#                  ngrok's edge answers any request whose User-Agent contains
#                  "Mozilla" with an interstitial splash page (ERR_NGROK_6024),
#                  so a link opened in a browser shows ngrok's warning instead
#                  of the file.  Programmatic fetches (OpenAI / Anthropic /
#                  curl — the multimodal-LLM path this tool exists for) pass
#                  through untouched.  Suppressing it server-side is not
#                  possible: ngrok forbids injecting the bypass header.
#
#   localhost.run  An SSH reverse tunnel — no account, no signup, nothing to
#                  install (Windows 10+ ships OpenSSH; a missing ssh client is
#                  reported as a tunnel failure, not a startup failure).  No
#                  splash page for any client, because TLS is terminated at
#                  their edge.  Trade-offs: the URL is a random *.lhr.life
#                  hostname that rotates after a few hours (the provider picks
#                  the new one up automatically), and file bytes are relayed by
#                  a third party.
#
#   cloudflare     A Cloudflare Quick Tunnel (`cloudflared tunnel --url`) — no
#                  account, no domain, no splash page, and the URL is stable
#                  for as long as the process lives.  Two caveats: the
#                  cloudflared binary is NOT bundled with slife2 and nothing
#                  installs it (missing → a tunnel failure, never a startup
#                  failure), and Cloudflare positions Quick Tunnels for
#                  testing/development while its free-tier terms restrict
#                  proxying media through the CDN — which is what sharing
#                  images does.
#
# Exactly one provider is active; the others stay configured and inert.  A name
# this build does not have falls back to ngrok with a warning rather than
# refusing to start: a tunnel is a subordinate dependency.  `tunnel_status`
# reports the provider actually in use.
file-tunnel:
  active: cloudflare
  providers:
    ngrok:
      # `${NGROK_AUTHTOKEN}` resolves from the shell env, then credstore.  An
      # option left out still works if the variable is exported.
      token: ${NGROK_AUTHTOKEN}
    localhost.run:
      # Binary name (resolved on PATH, then Windows' bundled OpenSSH) or an
      # absolute path to an ssh client.  The legacy key "ssh" also works.
      binary: ${SSH_BINARY:-ssh}
      host: localhost.run
      # "nokey" is localhost.run's anonymous free tier — no SSH key required,
      # so no -i identity is needed (and none is read from credstore).
      user: nokey
      # Remote port 80 is what maps to the https://<id>.lhr.life URL.
      remote_port: 80
    cloudflare:
      # Binary name (resolved on PATH, then the usual Windows install
      # locations) or an absolute path to cloudflared.  Quick Tunnels take no
      # token and no domain, so this and `protocol` are the whole config.
      binary: ${CLOUDFLARED_BINARY:-cloudflared}
      # Transport to the edge (cloudflared's --protocol): "http2", "quic" or
      # "auto".  Defaults to http2, which rides TCP.  cloudflared's own default
      # is quic, and QUIC is the one that fails behind a proxy or a TUN
      # adapter — it registers a connection, then repeatedly loses it to "no
      # recent network activity", and every window in between answers the
      # published URL with HTTP 530.
      protocol: ${CLOUDFLARED_PROTOCOL:-http2}

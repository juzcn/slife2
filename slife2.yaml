# slife2.yaml — the machine's configuration.
#
# One file, read by the launcher and every server. It must exist, be readable,
# and name its providers and embedder; a file that does not stops the start
# and names the mistake.
#
# Keep secrets out. `${VAR}`, `${VAR:-default}` and `keyring:<service>/<key>`
# are resolved from the shell environment, credstore or the OS keyring.

# Shift every server port by this much under WSL2 mirrored networking; ignored
# elsewhere. 0 disables it. The MQTT broker is not shifted.
wsl_port_offset: 100

servers:
  # One process per entry, each at 127.0.0.1:<port>/mcp.
  openai-completions: {port: 24001}
  anthropic-messages: {port: 24002}
  openai-responses: {port: 24003}
  embeddings: {port: 24004}
  # The agent loop, context store and tool set.
  agent: {port: 24000}
  context: {port: 24010}
  toolhub: {port: 24020}
  # MCP and REST servers.
  mcp-tools: {port: 24033}
  restapi-tools: {port: 24034}
  # Commands, playbooks and code-defined tools.
  cli-server: {port: 24032}
  skills-server: {port: 24031}
  job-server: {port: 24042}
  # Capabilities.
  wechat: {port: 24030}
  cabinet: {port: 24035}
  tui: {port: 24005}
  schedule: {port: 24039}
  peer-agent: {port: 24040}
  subagent: {port: 24041}
  media: {port: 24036}
  file-tunnel: {port: 24038}
  agent-task: {port: 24037}

providers:
  # `api` selects the wire protocol. Models are referenced as `provider/model`.
  deepseek:
    api: openai-completions
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}
    models:
      - model: deepseek-flash
        name: DeepSeek Flash
        reasoning: true
        input:
          - text
          - image
        context_window: 1000000
        max_tokens: 384000
        temperature: 0.7
        top_p: 1.0

  scnet:
    api: openai-completions
    base_url: https://api.scnet.cn/api/llm/v1
    api_key: ${SCNET_TOKEN_PLAN}
    models:
      - model: DeepSeek-V4
        name: DeepSeek V4 Pro
        reasoning: true
        input:
          - text
        context_window: 1000000
        max_tokens: 384000
        temperature: 0.7
        top_p: 1.0
      - model: Kimi-K3
        name: Kimi K3
        reasoning: true
        input:
          - text
          - image
        context_window: 1048576
        max_tokens: 131072
        # This gateway rejects the standard thinking field.
        compat:
          thinking: omit

  bailian:
    api: anthropic-messages
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/apps/anthropic
    api_key: ${QWEN_TOKEN_PLAN_PERSONAL}
    models:
      - model: qwen3.8-max
        name: Qwen3.8 Max
        reasoning: true
        input:
          - text
          - image
        context_window: 983616
        max_tokens: 131072

  # Responses is its own provider entry: `api: openai-responses`.

# The model a new conversation starts on, as `provider/model`.
default: deepseek/deepseek-flash

agent:
  # Model calls per turn. 0 or absent means no cap.
  max_iterations: 0
  # A Jinja2 template beside this file. `{{ agent_name }}` and `{{ headless }}`
  # are available; omit to use the shipped template.
  # system_prompt: prompts/jack.j2

agent-task:
  # Agent tasks running at once per agent.
  max_running: 4

subagent:
  # Subagents per agent. The tree stops at one level.
  max_running: 32
  # The local subagent network: `broker`, plus `org` to group meshes. `unit:`
  # is not a setting; `peer_agent:` uses this broker when it names none.
  provider: mosquitto
  broker:
    host: localhost
    port: 1883

embeddings:
  # OpenAI-compatible embedding endpoints. The width is discovered; changing
  # the model re-embeds the index on the next start.
  providers:
    local:
      base_url: http://127.0.0.1:17347/v1
      model: bge-m3
      api_key: local
    siliconflow:
      base_url: https://api.siliconflow.cn/v1
      model: BAAI/bge-m3
      api_key: ${SILICONFLOW_API_KEY}
  # The provider in use, by id. Omit to use the first.
  active_model: siliconflow

context:
  # `ceiling` and `floor` are fractions of the model's context window.
  ceiling: 0.8
  floor: 0.2
  recall_limit: 40
  # Gates measured similarity only; a keyword hit is exempt.
  min_similarity: 0.45
  # Seconds for the discriminator call; past it the turn uses its current
  # context.
  timeout: 20.0

tool_load:
  # Above this many loaded tools, the least recently used are unloaded at a
  # turn boundary. Nothing in `autoload` below is ever evicted.
  threshold: 100
  # The tools that start in the model's list, by the name the model calls them.
  # Everything else — a plugin's tools included — is found with `tool_search`,
  # listed with `tool_list`, and loaded with `func_tool_load`, and is evicted
  # when unused. The first eight are what the system works by; a list without
  # them fails the start.
  autoload:
    - tool_search
    - tool_list
    - func_tool_load
    - _func_tool_unload
    - _check_new_input
    - skill_use
    # The two that can use the task id an `_async` call returns.
    - check_async
    - cancel_async
    # Memory and recorded turns.
    - turn_search
    - turn_read
    - turn_list
    # Files, notes and reports.
    - cabinet_search
    - file_read
    - note_read
    - note_save
    - report_save
    # A tool output the harness shortened.
    - dump_read
    # Images.
    - attach_image
    # Web search and fetch, by each server's `{server}__{tool}` name — the
    # list is per tool, so the rest of each server stays on demand.
    - serper__google_search
    - deepseek-search__webSearch
    - deepseek-search__webFetch
    - baidu-search__chatCompletions
    # Delegation and the subagent network.
    - subagent_set
    - subagent_list
    - subagent_send_message
    - subagent_task_list
    - subagent_group_send_message
    # Asynchronous tasks.
    - agent_task_start
    - agent_task_status
    - agent_task_list

tool_result:
  # A result over this is kept whole as a dump; the conversation carries a
  # window of its lines. `dump_read` obeys the same budget. Minimum 128.
  tokens: 8000

mcp:
  # External MCP servers. `command` starts a process; `url` connects to one
  # already running. `enabled: false` keeps the entry configured but not
  # connected. Tools arrive as `{name}__{tool}`; one that should start loaded
  # goes in `tool_load.autoload` by that name — per tool, not per server.
  serper:
    command: npx
    args:
      - -y
      - serper-search-scrape-mcp-server
    env:
      SERPER_API_KEY: ${SERPER_API_KEY}
    description: Google web search via Serper — search the web and scrape result pages.
  fetch:
    command: uvx
    args:
      - --with
      - mcp>=1.0,<1.29
      - mcp-server-fetch
    description: Fetch and convert web pages to markdown. Pins mcp<1.29 for McpError compatibility.
  tavily-mcp:
    command: npx
    args:
      - -y
      - tavily-mcp@latest
    env:
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    description: Tavily AI-optimized web search — designed for LLM agents, returns clean structured results.
  duckduckgo-search:
    command: uvx
    args:
      - --with
      - duckduckgo-mcp-server[browser]
      - duckduckgo-mcp-server
      - --fetch-backend
      - auto
      - --search-backend
      - auto
    description: DuckDuckGo search MCP server — web search and content extraction via DuckDuckGo.
  amap-maps:
    command: npx
    args:
      - -y
      - '@amap/amap-maps-mcp-server'
    env:
      AMAP_MAPS_API_KEY: ${AMAP_MAPS_API_KEY}
    description: 高德地图官方 MCP Server，提供地理编码、逆地理编码、IP定位、天气查询、骑行/步行/驾车/公交路径规划、距离测量、关键词/周边/详情POI搜索、专属地图、输入提示、搜索提示、矩形区域交通态势、路径信息、距离测量等多种地图和位置服务。免费，需要申请 Web服务 API Key。
  playwright:
    command: npx
    args:
      - -y
      - '@playwright/mcp@latest'
      - --headless
    description: Playwright MCP server (official Microsoft) — headless browser automation via accessibility snapshots. Supports navigation, clicks, typing, screenshots, form filling, file uploads, and JavaScript execution.
  context7:
    command: npx
    args:
      - -y
      - '@upstash/context7-mcp'
    env:
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}
    description: Context7 MCP server (Upstash) — up-to-date library/framework API docs to eliminate LLM hallucinations. Resolution-based lookups for any version or commit (Unpkg-compatible projects only).
  chrome-devtools:
    command: npx
    args:
      - -y
      - chrome-devtools-mcp@latest
      - --no-usage-statistics
    description: Chrome DevTools MCP (official Google) — control and inspect real Chrome browser with performance profiling, network inspection, console access, DOM manipulation, and screenshots.
  citecheck:
    command: npx
    args:
      - -y
      - '@jhlee0619/citecheck'
    description: citecheck MCP server — automatically validate and fix references in academic papers. Extracts references from .tex/.md/.docx/.txt/.bib, validates against databases, and fixes inconsistencies. Supports arXiv/DOI/DBLP/ACL/custom APIs.
  mcp-pandoc:
    command: uvx
    args:
      - mcp-pandoc
    description: mcp-pandoc document format converter — use Pandoc to convert between Markdown/HTML/PDF/DOCX/RST/LaTeX/EPUB/TXT/IPYNB and more.
  markitdown:
    command: uvx
    args:
      - markitdown-mcp
    description: MarkItDown MCP server (Microsoft) — convert various file formats (PDF, DOCX, PPTX, XLSX, images via OCR, audio transcription, HTML, CSV, JSON, XML, ZIP) to Markdown.
  office-word-mcp:
    command: uvx
    args:
      - --from
      - office-word-mcp-server
      - word_mcp_server
    description: Office-Word-MCP server — create/read/edit Microsoft Word documents. Supports document management (create, merge, convert to PDF), content creation (headings, paragraphs, tables, images, page breaks), formatting (font, alignment, spacing), and comments.
  excel-mcp:
    command: npx
    args:
      - --yes
      - '@negokaz/excel-mcp-server'
    env:
      EXCEL_MCP_PAGING_CELLS_LIMIT: '4000'
    description: 'Excel MCP server — read/write MS Excel files. Supports reading/writing text values and formulas, creating worksheets/tables, copying worksheets, formatting cells (Windows: live editing + screenshots). Supports .xlsx/.xlsm/.xltx/.xltm. Free and open source.'
  pdf-toolkit:
    command: npx
    args:
      - -y
      - '@aryanbv/pdf-toolkit-mcp'
    description: 'PDF Toolkit MCP — 22-tool PDF suite: create PDFs from Markdown/structured data, render pages as images (for vision models to read scans), fill forms and extract values, split/merge/rotate/crop pages, add text/watermarks/annotations, extract and re-embed attachments.'
  arxiv:
    url: https://arxiv.mcp.brunosan.de/mcp
    description: arXiv paper search, download and reading for AI/ML/NLP/CV/robotics — free, no API key, uses the public arXiv API.
  crossref:
    command: npx
    args:
      - -y
      - '@cyanheads/crossref-mcp-server'
    description: Search and retrieve scholarly metadata from the Crossref REST API — 150M+ academic works, journals and funders; DOI resolution and reference lookup. No API key required.
  google-scholar:
    command: uvx
    args:
      - hasdata-google-scholar-mcp
    env:
      HASDATA_API_KEY: ${HASDATA_API_KEY}
    description: Google Scholar search results, citation counts and citation export formats, as structured JSON (HasData). Local stdio build; credential via HASDATA_API_KEY.
  desktop-commander:
    command: npx
    args:
      - -y
      - '@wonderwhy-er/desktop-commander@latest'
    description: 'Swiss-army-knife for your own machine: run terminal commands with streaming output, drive long-running and interactive processes, and read/write/search/edit files (diff-based surgical edits, ripgrep search, Excel/PDF/DOCX).'

  deepseek-search:
    command: npx
    args:
      - -y
      - deepseek-websearch-mcp
    env:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    description: 'DeepSeek 官方 Search / Fetch API 的 MCP server（社区实现，MIT）。webSearch：联网搜索，支持 site:/after:/before: 等操作符与 freshness 时效过滤，结果附带发布日期、权威度(0-4)、相关性分；webFetch：抓取网页返回 Markdown。需在 platform.deepseek.com 申请 Key，经环境变量 DEEPSEEK_API_KEY 注入。'
  baidu-search:
    url: https://qianfan.baidubce.com/v2/ai_search/mcp
    headers:
      Authorization: Bearer ${BAIDU_API_KEY}
    description: '百度智能云千帆「AI 搜索」官方 MCP Server（Streamable HTTP 远程端点）。工具 AIsearch：实时联网搜索，可选 model（ERNIE 等）由服务端大模型直接总结。鉴权：Authorization: Bearer <千帆/AppBuilder API Key（bce-v3/ALTAK-...）>，经环境变量 BAIDU_API_KEY 注入。'
rest-api:
  # `spec:` expands into `uvx mcp-openapi-proxy`; every endpoint becomes a tool.
  # `command:` uses a proxy of your own instead. A large spec is worth
  # `enabled: false`.
  github:
    spec: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.yaml
    base_url: https://api.github.com
    api_key: ${GITHUB_TOKEN}
    description: GitHub REST API via mcp-openapi-proxy — manage repos, issues, PRs, users, and more.
    enabled: false
  mcp-registry:
    spec: https://registry.modelcontextprotocol.io/openapi.json
    base_url: https://registry.modelcontextprotocol.io
    description: A community driven registry service for Model Context Protocol (MCP) servers. Provides APIs to list/search MCP servers, view server details, versions, and server.json metadata.

cli:
  # Programs already installed. Each entry is a catalogue row (`cli:<name>`),
  # not a callable tool; `install` is shown when the command is missing — by the
  # catalogue, and by the installer for a program it cannot install itself.
  yt-dlp:
    command: yt-dlp
    description: 'yt-dlp is a powerful command-line video downloader supporting 1000+ sites including YouTube, Twitter/X, Bilibili, TikTok, etc. Common usage: yt-dlp <URL> to download best quality; yt-dlp -f "bestvideo+bestaudio" --merge-output-format mp4 <URL> for best quality merged MP4; yt-dlp --list-formats <URL> to list available formats; yt-dlp -f <format_id> <URL> for specific format. Supports cookies, subtitles, playlists, and more.'
    install: uv pip install yt-dlp
  browser-harness:
    command: browser-harness
    description: "Direct browser control via CDP — automation, scraping, testing, screenshots. Subcommands: browser-harness <<'PY' ... PY (run Python helpers like new_tab, page_info, capture_screenshot, click_at_xy, js, etc.), browser-harness --doctor (diagnose connection), browser-harness skill (print SKILL.md), browser-harness auth login (cloud auth), browser-harness telemetry disable."
    install: uv tool install --python 3.12 --upgrade --force browser-harness
    source:
      type: pypi
      url: https://pypi.org/project/browser-harness/
      version: 0.1.5
      description: Official browser-harness package

  rg:
    command: rg
    description: ripgrep 14.1.0 — 快速递归文本搜索（gitignore 感知，带 PCRE2+JIT）。定字符串/行号首选，一次调用出结果，比"后台搜索会话+分页读"少绕两步。常用：rg -n "关键词" 路径 -g "*.py"（带行号并限定文件类型）；rg -l / rg -c 只列文件 / 计数；rg -uu 忽略 .gitignore 全扫（含 .venv、dist）；rg -U --pcre2 "多行模式" 跨行匹配；rg --json 供脚本消费；rg --stats 出统计；rg "FAILED|error" 某.log 定位失败行；rg -F 当纯字面量（搜 . 和 * 时用）。
    install: choco install ripgrep（Windows）；已装在 C:\ProgramData\chocolatey\bin\rg.exe
    source:
      type: choco
      version: 14.1.0
skills:
  # Playbooks live in skills/<name>/SKILL.md. This section supplies the
  # environment each playbook declares. Scripts are not run; `skill_use`
  # refuses a missing key.
  baidu-search:
    env:
      BAIDU_API_KEY: ${BAIDU_API_KEY}

media:
  # `kind` is what a model is for: image, video, tts, asr. `api` is its adapter
  # (`dashscope-aigc` or `openai-images`); a kind the adapter cannot serve is
  # refused. `defaults` applies when a call names no model; `params` and `voice`
  # are the model's own defaults.
  defaults:
    image: bailian_personal/wan2.7-image
    video: bailian_personal/happyhorse-1.1-t2v
  providers:
    bailian_personal:
      api: dashscope-aigc
      base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/api/v1
      api_key: ${QWEN_TOKEN_PLAN_PERSONAL}
      models:
        - model: wan2.7-image
          kind: image
        - model: wan2.7-image-pro
          kind: image
        - model: qwen-image-3.0-pro
          kind: image
        - model: happyhorse-1.1-t2v
          kind: video
          params:
            resolution: 720P
            ratio: 16:9
            duration: 5
        - model: happyhorse-1.1-i2v
          kind: video
          params:
            resolution: 720P
            duration: 5
        - model: happyhorse-1.1-r2v
          kind: video
          params:
            resolution: 720P
            duration: 5
        - model: qwen-audio-3.0-tts-plus
          kind: tts
          voice: longanhuan_v3.6
        - model: qwen-audio-3.0-asr-flash
          kind: asr

file-tunnel:
  # Exactly one provider is active; the others stay configured and inert.
  # `expose_local_image` serves a local file through the tunnel. An unknown
  # provider name is a config error, refused at load; `tunnel_status` reports
  # the provider in use.
  active: cloudflare
  providers:
    ngrok:
      token: ${NGROK_AUTHTOKEN}
    localhost.run:
      binary: ${SSH_BINARY:-ssh}
      host: localhost.run
      user: nokey
      remote_port: 80
    cloudflare:
      binary: ${CLOUDFLARED_BINARY:-cloudflared}
      # http2 avoids QUIC failures behind a proxy or TUN adapter.
      protocol: ${CLOUDFLARED_PROTOCOL:-http2}

peer_agent:
  # Presence enables the peer network. `broker` names another machine's broker;
  # left out, the subagent network's address is used. A local broker is started
  # when absent and stopped with the stack only if slife2 started it.
  #
  # `provider: mosquitto` is the only broker; `org` and `unit` are the topic
  # namespace that separates groups on one broker.
  provider: mosquitto
  # broker: {host: localhost, port: 1883}
  org: default
  unit: default

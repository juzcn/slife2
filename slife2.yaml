# slife2.yaml — one config file, read by every process and by the launcher.
#
# `servers:` holds addresses and nothing else.  Every component that listens on
# a port is named there once, and everything else refers to it by name — so the
# launcher knows what to start, the agent server knows where to find its model,
# and none of them can disagree about a port.
#
# This file is checked in, and it is safe to check in: it holds no secrets.
# Every ${VAR} resolves through shell env -> credstore -> literal default, so
# keys live in the environment or in the credential store (`credstore set
# DEEPSEEK_API_KEY`), never here.  An unresolved reference is left verbatim
# rather than raising, so a missing key fails at the API call — where the
# message can name it — rather than at startup.
#
# Every value below is the built-in default, so this file can also be deleted
# and the four processes will still start with the same ports and providers.

# ── The MCP servers ─────────────────────────────────────────────────────────
# slife2 starts these on demand and shares them: a second instance attaches to
# whatever is already running rather than starting a duplicate.  They are
# daemons — a client exiting never stops one.  `slife2 status` / `slife2 down`
# manage them.
servers:
  agent:
    host: 127.0.0.1
    port: 8000
    path: /mcp
  llm-openai:
    host: 127.0.0.1
    port: 8001
    path: /mcp
  llm-anthropic:
    host: 127.0.0.1
    port: 8002
    path: /mcp

# ── Models ──────────────────────────────────────────────────────────────────
# Each provider names the server that serves it.  A server is started because
# a provider points at it, so deleting a provider stops a process — there is no
# second switch to keep in step with this table.
#
# A provider may instead give a bare `url`, for a model server this machine does
# not manage (already running elsewhere); slife2 then connects but never starts
# it.
providers:
  deepseek:
    server: llm-openai
    model: deepseek-chat
  claude:
    server: llm-anthropic
    model: claude-sonnet-5-5
default: deepseek

# ── The agent loop ──────────────────────────────────────────────────────────
agent:
  # Model calls allowed in one turn before it is cut off.  A model that keeps
  # calling tools would otherwise run indefinitely; the cap ends the turn
  # normally rather than raising.
  max_steps: 16
  system_prompt: "You are slife2, a terminal agent. Be concise."

# ── slife2-llm-openai ───────────────────────────────────────────────────────
# Any OpenAI-compatible endpoint: OpenAI, DeepSeek, Ollama, vLLM, most gateways.
llm_openai:
  base_url: "https://api.deepseek.com/v1"
  api_key: ${DEEPSEEK_API_KEY}
  # Ask for token counts on the final stream chunk.  This uses `stream_options`,
  # an OpenAI extension that some compatible servers reject with a 400 — set it
  # to false for one of those and the only loss is the token counts.
  stream_usage: true

# ── slife2-llm-anthropic ────────────────────────────────────────────────────
llm_anthropic:
  api_key: ${ANTHROPIC_API_KEY}
  # Anthropic requires max_tokens on every request; the OpenAI-compatible API
  # does not, so there is no shared setting for it.
  max_tokens: 4096

# ── The TUI ─────────────────────────────────────────────────────────────────
# Defaults to wherever `servers.agent` says, so it is normally omitted.
tui:
  url: "http://127.0.0.1:8000/mcp"

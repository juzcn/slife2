name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: uv build --out-dir dist

      # `shell: bash` is load-bearing, not a style choice.  The default shell on
      # a Windows runner is PowerShell, which does not expand globs — it passes
      # `dist/slife2-*.whl` through literally and uv rejects it with "The wheel
      # filename ... is invalid: Must have a Python tag".  bash is present on
      # all three runners and expands it as intended.
      - name: Install
        shell: bash
        run: uv pip install dist/slife2-*.whl pytest pytest-asyncio

      - name: Run tests
        run: uv run pytest -v --tb=short --no-header --maxfail=5

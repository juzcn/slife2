name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.13']

    steps:
      - uses: actions/checkout@v4

      # Read-only on purpose: no uv, no venv, no package installation.  It
      # exercises platform detection and argument parsing on every OS and proves
      # the installer can answer "what would you do" without changing anything.
      - name: Installer dry run (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/install.sh --dry-run

      - name: Installer dry run (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -DryRun

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # macOS only, and it is a *requirement* rather than a preference.  The
      # vector index is a SQLite extension (`sqlite-vec`), and uv's managed
      # CPython is built without `--enable-loadable-sqlite-extensions` —
      # python-build-standalone links SQLite statically — while Apple's system
      # SQLite does not support them either.  A Python that cannot load one has
      # no index, so `slife2.libs.store.db` refuses to open, so every plugin dies: not one
      # failing test but the whole product.  Windows and Linux builds have the
      # feature, which is why this is invisible anywhere but here.
      #
      # Three things about the two lines below, each of which was a red run:
      #
      # * **A venv, not an install into the interpreter.**  Homebrew marks its
      #   Python externally managed (PEP 668), because `brew upgrade` owns that
      #   tree, and uv honours the marker: "The interpreter ... is externally
      #   managed".
      # * **`--clear`,** because `setup-uv` has already left a `.venv` built
      #   from its own managed interpreter — the one with no loadable SQLite.
      #   Replacing it is the point of the step, and nothing is installed into
      #   it until `Install` below.
      # * **`UV_PYTHON` is deliberately NOT set.**  It reads like the way to
      #   point the whole job at this interpreter, and it is the opposite: with
      #   it set, `uv pip install` targets that interpreter *directly* instead
      #   of discovering `.venv`, which is the PEP 668 failure above.  The venv
      #   is what routes every later step, and `uv run` prefers it already.
      #
      # `brew --prefix <formula>` rather than `$(brew --prefix)/bin/python3.13`:
      # the keg's own path does not depend on which Homebrew Python happens to
      # own the unversioned `python3` symlink.
      - name: A Python that can load SQLite extensions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install python@3.13
          uv venv --clear --python "$(brew --prefix python@3.13)/bin/python3.13"

      - name: Build wheel
        run: uv build --out-dir dist

      # `shell: bash` is load-bearing, not a style choice.  The default shell on
      # a Windows runner is PowerShell, which does not expand globs — it passes
      # `dist/slife2-*.whl` through literally and uv rejects it with "The wheel
      # filename ... is invalid: Must have a Python tag".  bash is present on
      # all three runners and expands it as intended.
      # `pytest-xdist` is not optional: `addopts` runs the suite across workers
      # (`-n auto`), and a runner without the plugin dies at option parsing.
      - name: Install
        shell: bash
        run: uv pip install dist/slife2-*.whl pytest pytest-asyncio pytest-xdist

      # The precondition the macOS step above exists for, asserted rather than
      # assumed.  Without it, a runner whose interpreter cannot load extensions
      # reports five "Client failed to connect" errors out of `test_agent_task`
      # and stops — which names neither SQLite nor the interpreter, and cost
      # five days the first time.  ASCII only, because it is printed: a console
      # whose codepage is not UTF-8 turns an em-dash into the failure this
      # assertion is trying to report.
      - name: The interpreter can load SQLite extensions
        shell: bash
        run: |
          uv run python -c "
          import sqlite3
          connection = sqlite3.connect(':memory:')
          assert hasattr(connection, 'enable_load_extension'), (
              'this interpreter has no enable_load_extension: it was built '
              'without --enable-loadable-sqlite-extensions, so there is no '
              'vector index and slife2 cannot open its database'
          )
          connection.enable_load_extension(True)
          print('sqlite extension loading: OK')
          "

      # Before the tests, because it is seconds and it fails with a file and a
      # line rather than a traceback.  The rules live in pyproject.toml and were
      # clean for a long time while nothing checked them — a lint step that
      # never runs is a convention rather than a constraint.
      - name: Lint and format
        run: |
          uv run --with ruff ruff check .
          uv run --with ruff ruff format --check .

      # `slife2` only — `[tool.pyright]` excludes the tests, which use doubles
      # that are deliberately not the types they stand in for.  In the project
      # environment rather than standalone, so the checker can resolve the
      # dependencies; a runner without them reports forty import errors and
      # none of the real ones.
      - name: Type check
        run: uv run --with pyright pyright

      - name: Run tests
        run: uv run pytest -v --tb=short --no-header --maxfail=5

      # The second lane: the whole stack as processes, against a stub provider
      # (`tests/e2e/`, excluded from the run above by `addopts`).  It is here
      # rather than merged into it because what it proves is different in kind —
      # that the launcher's start order works, that a turn crosses every process
      # boundary — and because seventeen daemons per platform on the fast lane
      # would be paid for by every push.
      - name: Run the end-to-end lane
        run: uv run pytest -m e2e -v --tb=short --no-header
